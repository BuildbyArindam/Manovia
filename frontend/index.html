<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Manovia</title>
    <meta
      name="description"
      content="Manovia is a private, safety-first self-help companion. It is not therapy, not a diagnosis, and not a crisis service."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Day 25 (PWA). The manifest, an iOS home-screen icon, and the two
      `theme-color`s the OS uses to paint the status bar when the app is
      installed. The colours are the same sage/paper pair as the CSS tokens in
      src/index.css, and `media` keeps the dark one from being applied on a
      light-only device.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manovia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Day 25 (low-bandwidth): Noto Sans Devanagari and Noto Sans Bengali are
      loaded asynchronously on demand by I18nProvider only when the reader
      switches to Hindi (`hi`) or Bengali (`bn`), so an English or offline
      reader never pays a render-blocking third-party stylesheet round-trip on
      first paint. The CSP in docker/security-headers.conf still allows those
      two origins when needed.
    -->
    <!--
      The palette is resolved by a module, not an inline script: an inline script
      is what a strict `script-src 'self'` policy (see docker/nginx.conf and the
      API's SecurityHeadersMiddleware) refuses to run. The CSS keeps a
      `prefers-color-scheme` fallback so a reader with no explicit choice never
      sees the wrong palette while this module loads.
    -->
    <script type="module" src="/src/theme/first-paint.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
