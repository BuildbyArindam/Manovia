<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Manovia</title>
    <meta
      name="description"
      content="Manovia is a private, safety-first self-help companion. It is not therapy, not a diagnosis, and not a crisis service."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The palette is resolved by a module, not an inline script: an inline script
      is what a strict `script-src 'self'` policy (see docker/nginx.conf and the
      API's SecurityHeadersMiddleware) refuses to run. The CSS keeps a
      `prefers-color-scheme` fallback so a reader with no explicit choice never
      sees the wrong palette while this module loads.
    -->
    <script type="module" src="/src/theme/first-paint.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
