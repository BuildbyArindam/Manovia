<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Manovia</title>
    <meta
      name="description"
      content="Manovia is a private, safety-first self-help companion. It is not therapy, not a diagnosis, and not a crisis service."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Resolve the palette before first paint so a dark-mode user never sees a
      // white flash: an explicit choice wins, otherwise follow the OS. The same
      // logic lives in src/theme/ThemeProvider.tsx; this copy only exists to
      // paint the right colours on the very first frame.
      (function () {
        try {
          var stored = window.localStorage.getItem("manovia.theme");
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
