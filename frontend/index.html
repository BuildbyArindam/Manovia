<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Manovia</title>
    <meta
      name="description"
      content="Manovia is a private, safety-first self-help companion. It is not therapy, not a diagnosis, and not a crisis service."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Day 23 linked the Noto Sans Devanagari / Bengali stylesheet here. Day 25
      moved it to src/lib/i18n/scriptFonts.ts: it is added only for a Hindi or
      Bengali interface, so English readers no longer wait on a render-blocking
      cross-origin stylesheet. The CSP still allows exactly those two origins.
    -->
    <meta name="theme-color" content="#2e6a4e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!--
      The palette is resolved by a module, not an inline script: an inline script
      is what a strict `script-src 'self'` policy (see docker/nginx.conf and the
      API's SecurityHeadersMiddleware) refuses to run. The CSS keeps a
      `prefers-color-scheme` fallback so a reader with no explicit choice never
      sees the wrong palette while this module loads.
    -->
    <script type="module" src="/src/theme/first-paint.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
