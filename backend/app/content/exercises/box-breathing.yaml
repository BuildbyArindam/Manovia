id: box-breathing
title:
  en: Box breathing
  hi: चार गिनती वाली साँस
  bn: চার গুনে শ্বাস নেওয়া
instructions_language: en
description: Follow a gentle four-part rhythm, with optional pauses.
duration_seconds: 120
steps:
- id: settle
  duration_seconds: 16
  instruction: Sit with support or stand somewhere steady. Let your breathing be ordinary. The counts
    are a guide, not a target.
  cue: instruction
- id: inhale-1
  duration_seconds: 4
  instruction: Breathe in gently for up to four counts. Take a normal-sized breath; do not force it.
  cue: inhale
- id: hold-in-1
  duration_seconds: 4
  instruction: If comfortable, pause for up to four counts. If holding feels uncomfortable, breathe
    normally instead.
  cue: hold-in
- id: exhale-1
  duration_seconds: 4
  instruction: Breathe out gently for up to four counts. A shorter, comfortable breath is fine.
  cue: exhale
- id: hold-out-1
  duration_seconds: 4
  instruction: If comfortable, pause for up to four counts. Breathe normally whenever you need to.
  cue: hold-out
