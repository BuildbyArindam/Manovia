contraindications:
- If breath-holding makes you dizzy, breathless, or uncomfortable, breathe normally and stop.
- Do not practise while driving, in water, or where a pause in attention could be unsafe.
- If a breathing or heart condition makes paced breathing unsuitable for you, skip this and choose
  an outside-focus exercise.
notes:
- No breath needs to be deep or forced. You can ignore the counts, skip every hold, pause, or stop.
- Keep your eyes open if that feels steadier. This is self-help, not treatment.
