  - amake
  - nijer
  - nije

# Possessive-relative phrases ("my friend", "her brother", "the kids") are the
# one case where a first-person-looking word says nothing about the speaker: the
# sentence is about the relative. Before asking "is there a first-person subject
# in this clause?" the engine blanks these phrases out, so that
# "my friend says she wants to die" is about the friend while
# "I want to die, my mum doesn't care" stays about the speaker.
relation_possessives:
  - my
  - our
  - his
  - her
  - their
  - your
  - this
  - that
  - a
  - an
  - the

