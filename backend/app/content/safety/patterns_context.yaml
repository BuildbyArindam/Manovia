# A figurative-prone hit (one whose wording is common in everyday exaggeration) is
# suppressed when its clause matches one of these frames. Every frame below is a
# sentence people say about *things*, not about themselves.
benign_frames:
  - "\\b(?:laughing|laugh|dying|dead)\\s+(?:to death|myself to death|of laughter|with laughter|of\\s+(?:embarrassment|shame|curiosity|boredom|cringe|excitement|jealousy))\\b"
  - "\\b(?:bored|scared|starving|freezing|exhausted|sick|tired)\\s+to\\s+death\\b"
  - "\\b(?:dying|dead)\\s+(?:to|for)\\s+(?:know|see|try|get|have|be|go|meet|hear)\\b"
  - "\\b(?:dead|deceased)\\s+(?:tired|exhausted|asleep|serious|air|end|battery|phone|line|zone|quiet|last|ahead|gone|simple)\\b"
  - "\\b(?:kill|killing|murder|murdering)\\s+(?:it|that|this|time|some time|the time|a|the vibe|the mood|them)\\b"
  - "\\b(?:killer|deadly|lethal|mortal)\\s+(?:app|deal|workout|recipe|joke|look|smell|bee|virus|bug|combo|move|voice|haircut|outfit|song|playlist|storm|heat|cold|exam|deadline)\\b"
  - "\\b(?:murder|killed|kill)\\s+(?:mystery|ball|the ball|your darlings|my darlings)\\b"
  - "\\b(?:i|we)\\s+(?:could|can|might|may|would)\\s+(?:die|kill)\\s+(?:for|of)\\b"
  - "\\b(?:the|my|this|that)\\s+(?:world|planet|country|city|team|company|economy)\\s+is\\s+(?:ending|dying|dead)\\b"
  - "\\bend\\s+(?:of|the)\\s+(?:the\\s+)?(?:world|semester|term|year|month|day|week|quarter|course|shift)\\b"
  - "\\b(?:game|movie|film|show|series|book|episode|season|match|level)\\s+(?:killed|kills|is killing|ended|ends|spoiler)\\b"

