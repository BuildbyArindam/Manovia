version: 1

preface:
  default: >-
    শুরু করার আগে এক ছোট কথা। এটা একটা হালকা, নিজ-নির্দেশিত
    অনুশীলন, চিকিৎসা পরামর্শ নয়, আর চিকিৎসাও নয়। আপনি যেকোনো সময়
    থেমে যেতে পারেন — কিছু শেষ করার দরকার নেই, আর এখানে কিছুই
    নিজে-নিজে এগিয়ে যাবে না। যদি কোনো সময়ে অস্বস্তি করতে থাকে, তবে
    শুধু থেমে যান এবং যা সঠিক বলে মনে হয় তাই করুন।
  unknown: >-
    শুরু করার আগে এক ছোট কথা। আপনি যদি গাড়ি চালান, অনুগ্রহ করে
    গাড়ি চালানোর সময় এই অনুশীলন করবেন না — আগে কোনো নিরাপদ জায়গায়
    গাড়ি থামিয়ে নিন। আপনি যেকোনো সময় থেমে যেতে পারেন — কিছু শেষ
    করার দরকার নেই। এটা নিজ-নির্দেশিত অনুশীলন, চিকিৎসা পরামর্শ নয়,
    আর চিকিৎসাও নয়।
  walking: >-
    শুরু করার আগে এক ছোট কথা। আপনি চলছেন, তাই আপনার মনোযোগ আপনার
    কাছেই থাকবে: চোখ বন্ধ নয়, আর পথ থেকে নজর সরাবেন না। এটা একটা
    হালকা, নিজ-নির্দেশিত অনুশীলন, চিকিৎসা পরামর্শ নয়, আর চিকিৎসাও
    নয়। আপনি যেকোনো সময় থেমে যেতে পারেন — কিছু শেষ করার দরকার নেই।
  driving: >-
    শুরু করার আগে নিরাপত্তা নিয়ে এক কথা। অনুগ্রহ করে গাড়ি চালানোর
    সময় এই অনুশীলন করবেন না। আপনি যদি গাড়ি চালান, আগে কোনো
    নিরাপদ জায়গায় গাড়ি থামিয়ে নিন, তারপর শুরু করুন। এটা তখন করার
    জন্য, যখন আপনি স্থির থাকবেন। আপনি যেকোনো সময় থেমে যেতে পারেন,
    আর এটা নিজ-নির্দেশিত অনুশীলন, চিকিৎসা পরামর্শ নয় আর চিকিৎসাও
    নয়।

eyes:
  open: >-
    চাইলে আপনার চোখ খোলা রাখুন, নজর সামনে কোনো শান্ত জায়গায় রেখে।
  closed: >-
    যদি আরামদায়ক লাগে, আপনি এখন চোখ বন্ধ করে নিতে পারেন। যদি না
    করেন, তবে নজর সামনে কোনো শান্ত জায়গায় নরমভাবে রাখুন।

stop:
  cue: >-
    আপনি যেকোনো সময় থেমে যেতে পারেন, আর এমন নির্দেশ যদি আপনাকে
    সাঙ্গ না বোধ হয়, তা এড়িয়ে যেতে পারেন।
  closing: আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।

breath_cues:
  - >-
    চলুন কয়েকটা সাধারণ শ্বাস একসাথে নিই। নাক দিয়ে ভেতরে, আর মুখ
    দিয়ে বাইরে, যতক্ষণ সেটা স্বাভাবিক না লাগে। কোনো গতি মিলানোর
    দরকার নেই।
  - >-
    নরমভাবে শ্বাস ভেতরে নিন, আর শ্বাসকে ধীরে ধীরে বাইরে যেতে দিন। যদি
    শ্বাস ছোট মনে হয়, ছোটই থাকতে দিন। এখানে কোনো কিছুকে জোর করে
    করার দরকার নেই।
  - >-
    আসমান কয়টি শ্বাসে, যদি আরামদায়ক লাগে, শ্বাস বাইরে দেওয়াকে
    শ্বাস ভেতরে নেওয়া থেকে একটু লম্বা রাখুন। যদি না হয়, তবে যেমন আছেন
    তেমনই শ্বাস নিন।
  - >-
    একটা শ্বাসকে একবারে অনুভব করুন। ভেতরে, আর বাইরে। আপনার মনোযোগ
    দূরে যেতে দিন, আর সে ফিরলে শ্বাসে ফিরতে দিন।

themes:
  morning:
    openings:
      - >-
        শুভ সকাল। এর কোনো নির্দিষ্ট জায়গায় পৌঁছানোর দরকার নেই। আপনি
        যদি এখন যেখানে আছেন, দিন এখনও শুরু হয়নি, তবে আপনি শুধু এটা
        বুঝে শুরু করতে পারেন যে আপনি এখানে আছেন।
      - >-
        শুভ সকাল। দিন পূর্ণ হওয়ার আগে, এই মুহূর্তটা শুধু আপনার। আমরা
        এটা আপনার পছন্দমতো কাটাতে পারি — শান্তি নিয়ে, আর নিজের গতিতে।
    passages:
      - >-
        লক্ষ্য করুন আপনি শরীরে কোথায় আছেন। পা, হাতের তালু, শরীরের
        ওজন যেখানে থেমে আছে। একে কোনো কিছু বদলানোর দরকার নেই। শুধু
        কয়েকটি শ্বাসের জন্য শরীরকে উপস্থিত থাকতে দিন।
      - >-
        সামনের দিনকে এখন সমাধান করার দরকার নেই। আপনি তখন তার সাথে
        আলাপ করতে পারেন, যখন সে আসবে, এক এক মুহূর্তে। এখন কেবল এই
        শ্বাস আছে, আর পরের শ্বাস।
      - >-
        আপনি আজ যা সঙ্গে করে আছেন, একসাথে বহন করার দরকার নেই। আপনি
        ধীরে শুরু করতে পারেন, আর ছোট থেকে শুরু করতে পারেন।
      - >-
        যদি দিন সম্পর্কে কোনো চিন্তা আসে, আসতে দিন। তার সাথে বিবাদ
        করার দরকার নেই, আর সেটা সঠিক মানার দরকারও নেই। আপনি সেটা
        যেতে দিতে পারেন, যেমন মেঘ যায়।
    closings:
      - >-
        এখন এটাই যথেষ্ট। আপনি যখন প্রস্তুত, আরেকটা শ্বাস নিন — ভেতরে,
        আর বাইরে — আর নিজের গতিতে দিনে ফিরে যান। আপনি যখন প্রস্তুত,
        তখনই এখন থেমে যেতে পারেন।
      - >-
        আপনি শুধু এখানে থেকেই পুরো অনুশীলনটা করে ফেলেছেন। যখন প্রস্তুত
        হবেন, আরেকটা শ্বাস নিন, আর সকালে ফিরে যান। আপনি যখন প্রস্তুত,
        তখনই এখন থেমে যেতে পারেন।

  focus:
    openings:
      - >-
        এটা আপনার মনোযোগের জন্য এক ছোট বিরতি। আমরা মনকে খালি করার
        চেষ্টা করছি না — তা সম্ভব নয়, আর এইটাও তা নয়। আমরা শুধু
        আপনার মনোযোগকে একটা জায়গা দিচ্ছি যেখানে সে বিশ্রাম নিতে পারে।
      - >-
        যদি আপনার মন ব্যস্ত থাকে, এটা সে জায়গা যেখানে আপনি একটুক্ষণ
        সেটা রেখে দিতে পারেন। এখানে কিছু অর্জন করার দাবি নেই। একটাই
        কাজ — লক্ষ্য করা।
    passages:
      - >-
        আপনার মনোযোগ নিজের শ্বাসের শব্দে আনুন। সেটা বদলানোর দরকার নেই
        — শুধু কয়েকটি শ্বাসের জন্য সেটাকেই ঐ কাজ রাখুন যেটাতে আপনার
        মনোযোগ দিচ্ছেন।
      - >-
        আপনি লক্ষ্য করবেন যে মনোযোগ দূরে চলে যায়। এটা স্বাভাবিক। যখন
        বুঝবেন সে চলে গেছে, তখন দরদীভাবে, দোষ দেওয়া ছাড়াই, সেটা
        ফিরিয়ে আনুন। ওই ছোট্ট ফিরে-আসাটাই পুরো অনুশীলন।
      - >-
        আপনার দৃষ্টি নরম রাখুন। হাতগুলোকে বিশ্রাম নিতে দিন। দিনের বাকি
        অংশকে একটু অপেক্ষা করতে দিন — এতদিন সে অপেক্ষা করেছে, আর একটু
        বেশি করতে পারে।
      - >-
        যদি কোনো দুশ্চিন্তা আসে, তবে সেটাকে মনে একটা নাম দিন — একটা
        কাজ, একটা বার্তা, একজন মানুষ — তারপর থাকতে দিন। প্রায়ই নাম দিলে
        সেটাকে যতটা মনোযোগ মিলে যায় যে সেটা বিশ্রাম নিতে পারে।
    closings:
      - >-
        আরেকটা শ্বাস — ভেতরে, আর বাইরে। আপনি যে কাজ করছিলেন সেখানে
        ফিরলে, আপনাকে এমন গতিতে করার অনুমতি আছে যেটা ভালো লাগে।
        আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।
      - >-
        এখন এটাই যথেষ্ট। আপনার মনোযোগ বিশ্রামের এক মুহূর্ত পেয়েছে।
        যখন প্রস্তুত হবেন, আরেকটা শ্বাস নিন, আর দিনে ফিরে যান। আপনি
        যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।

  stress-release:
    openings:
      - >-
        যখন শরীরে অনেক চাপ জমছে, সেটা আজ-ই গলে যায় না। তাই এর লক্ষ্য
        কোনো কিছুকে জোর করে শিথিল করার না। এর লক্ষ্য শরীরকে সেটা করার
        জায়গা দেওয়া, যা সে আগেই জানে।
      - >-
        যদি দিন ভারী লাগে, তবে এখানে সব খুলে বলায় দরকার নেই। আমরা
        শুধু শরীরকে কয়েক মিনিটের শান্তি দিতে পারি, আর থাকতে দিতে পারি।
    passages:
      - >-
        লক্ষ্য করুন এখন চাপ শরীরে কোথায় বসে আছে — কাঁধ, চোয়াল, হাত,
        পেট। সেটার নাম বলতে বা ঠিক করার দরকার নেই। শুধু এক-দুই
        শ্বাসের জন্য সেটা লক্ষ্য করতে দিন।
      - >-
        যেমন আপনি শ্বাস বাইরে দিচ্ছেন, কাঁধ চাইলে একটু নামতে দিন। হাত
        যদি মোচড়ানো থাকে, খুলতে দিন। কিছুই পূর্ণ হতে হবে না — একটু
        টাই যথেষ্ট।
      - >-
        আপনাকে এটা নিচে রাখার অনুমতি আছে। আজ মনে যা ছিল, তাকে
        আগামী কয়েক মিনিটের জন্য বহন করার দরকার নেই। আপনি সেটা রেখে
        দিতে পারেন, আর যখন চাইবেন তখন পরে তুলে নিতে পারেন।
      - >-
        চাপ প্রায়ই নিজে-নিজে কমতে থাকে, যখন সে লড়াইয়ের মধ্যে ধরা
        পড়া বন্ধ করে দেয়। তাই শুধু শ্বাস নিন, আর শরীরকে নিজের কাজ
        নিজের গতিতে করতে দিন।
    closings:
      - >-
        আরেকটা ধীর শ্বাস বাইরে দিন, আর যা বাকি আছে সেটাকেই থাকতে
        দিন। আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন, আর নিজের
        গতিতে দিনে ফিরে যেতে পারেন।
      - >-
        এখন এটাই যথেষ্ট। শরীর বিশ্রাম নিতে জানে; আপনি শুধু সেটাকে
        সুযোগ দিয়েছেন। যখন প্রস্তুত হবেন, আরেকটা শ্বাস নিন। আপনি যখন
        প্রস্তুত, তখনই এখন থেমে যেতে পারেন।

  calm:
    openings:
      - >-
        এখানে পৌঁছানোর মতো কিছু নেই, আর গুছানোর মতো কিছুও নেই। এটা
        শুধু কয়েক মিনিট — যেখানে আছেন সেখানে থাকার জন্য।
      - >-
        এর জন্য আপনাকে আরও শান্ত বোধ করতে হবে না। এখানে থাকা, শ্বাস
        নেওয়া, কয়েক মিনিটের জন্য — এটাই যথেষ্ট।
    passages:
      - >-
        চারপাশের শব্দগুলো লক্ষ্য করুন। দূরে ও কাছে, আসা-যাওয়া। সেগুলো
        চিনতে হবে না। সেগুলোকে আপনার জায়গার শব্দ হিসেবে থাকতে দিন।
      - >-
        লক্ষ্য করুন আপনার শরীর যেখানে ভর পাচ্ছে, সেখানে তার ওজন
        আছে। চেয়ার, মেঝে, মাটি। এই মিনিটে আপনাকে নিজেকে ধরে রাখতে
        হবে না।
      - >-
        চিন্তা আসবে, আর সেটা ঠিক আছে। সেগুলোকে ঠেলে দিতে হবে না,
        নইলে তার পেছনে যেতে হবে। শুধু লক্ষ্য করুন, আর শ্বাসকে এগিয়ে
        যেতে দিন।
      - >-
        যদি সম্ভব হয়, শ্বাসকে প্রয়োজন থেকে একটু ধীর রাখুন। জোর করে
        না — শুধু অনুমতি দিয়ে। ভেতরে, আর বাইরে, যে গতিটা সঠিক লাগে।
    closings:
      - >-
        আপনি যখন চাইবেন দিনে ফিরে যেতে পারেন। আরেকটা শ্বাস নিন —
        ভেতরে, আর বাইরে — আর আপনি চাইলে এর বাকি অংশটা সঙ্গে রাখতে
        পারেন। আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।
      - >-
        এখন এটাই যথেষ্ট। এখানে কিছুই বাধ্যতামূলক ছিল না, আর আপনি সব
        করে ফেলেছেন। যখন প্রস্তুত হবেন, আরেকটা শ্বাস নিন। আপনি যখন
        প্রস্তুত, তখনই এখন থেমে যেতে পারেন।

  sleep:
    openings:
      - >-
        এটা ধীরে আসার সময়, কোনো পরীক্ষা নয়। আপনি যদি ঘুমিয়ে পড়েন,
        সেটা সফলতা, ব্যর্থতা নয়। ঘুমালেও না, সেটাও ঠিক আছে। এটা শুধু
        ঘুমের আগে কয়েকটি শান্ত মিনিট।
      - >-
        দিন শেষ হয়ে গেছে, আর আজ রাতে সে আপনাকে আর কিছু চায় না।
        আমরা এই মিনিটগুলো আরও শান্ত হতে দেখতে পারি, যেমন ঘর শান্ত
        হয়ে যায় যখন আলো নিভে যায়।
    passages:
      - >-
        আপনার মনোযোগ হাত থেকে শুরু করুন। আঙুল, তালু, কবজি। সেখানে
        কিছু করার নেই — শুধু কয়েকটি শ্বাসের জন্য সেগুলোকে ভারী আর
        গরম থাকতে দিন।
      - >-
        মনোযোগ কাঁধের কাছে নিয়ে যান। সেগুলোকে যতটা সম্ভব নরম থাকতে
        দিন। যদি কোনো কাঁধ উঠতে চায়, উঠতে দিন। নামতে চায়, নামতে দিন।
      - >-
        শ্বাসকে নিজের গতি খুঁজতে দিন। গুনতে, আকার দিতে বা ঠিক করতে
        হবে না। ভেতরে, আর বাইরে। শ্বাস আগেই জানে কী করতে হয়।
      - >-
        যদি রাতে চিন্তা আসে, সেগুলোর উত্তর দিতে হবে না। সেগুলোকে
        আসা-যাওয়া করতে দিন, যেমন একটি শান্ত জানালায় বাইরের যানবাহন
        পেরিয়ে যায়। আপনি শান্ত অংশে আছেন।
    closings:
      - >-
        আপনি এখন এটা ছেড়ে দিতে পারেন, আর রাতকে নিজের কাজ করতে দিন।
        আরেকটা শ্বাস — ভেতরে, আর বাইরে — আর যদি আরাম লাগে, নিজেকে
        আরাম করতে দিন। আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।
      - >-
        এখন এটাই যথেষ্ট। রাতের বাকি অংশ আপনার, আর সে আপনাকে কিছু
        চায় না। আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।

  gratitude:
    openings:
      - >-
        এটা আজকের ভালো অংশগুলো দেখার জন্য এক ছোট বিরতি। সেগুলো বড়
        হতে হবে না। ছোট জিনিসগুলো গণনায় আসে, আর শান্ত জিনিসগুলোও।
      - >-
        এর কাজ করার জন্য আপনাকে কৃতজ্ঞ বোধ করতে হবে না। শুধু কয়েক
        মিনিট লাগবে, কী ভালো ছিল তা খোঁজার জন্য, যে গতিটা নরম লাগে।
    passages:
      - >-
        আজকের একটা ছোট জিনিসের কথা ভাবুন যা ঠিক ছিল, বা ঠিকের চেয়ে
        ভালো। সেটা খাবার হতে পারে, বার্তা, আবহাওয়ার একটা অংশ। যতটা
        দরকার হয় ততটা ছোট থাকতে দিন।
      - >-
        সম্ভব হলে, এমন একজন মানুষকে লক্ষ্য করুন যিনি আজকে একটু সহজ
        করেছেন। কিছু বলতে হবে না, আর কিছু করারও দরকার নেই। শুধু
        তাকে লক্ষ্য করতে দিন।
      - >-
        এমন এক জিনিসের কথা ভাবুন যা আপনার শরীর আজ আপনার জন্য করেছে
        — আপনাকে চালাতে, গরম করতে, স্বাদ নিতে। সে চুপচাপ কাজ করছে,
        আর আপনাকে সেটা লক্ষ্য করার অনুমতি আছে।
      - >-
        যদি দিনটা বেশিরভাগটা কঠিন হয়, সেটা সততার কথা, আর সেটা
        মনোযোগ পেয়েছে। তবুও আপনি এমন একটা ছোট জিনিস লক্ষ্য করতে
        পারেন যা খারাপ ছিল না — এক গ্লাস পানি, এক মিনিটের শান্তি,
        এক কঠিন মুহূর্তের শেষ।
    closings:
      - >-
        এখন এটাই যথেষ্ট। এর যেকোনো অংশ ধরে রাখতে হবে না — আপনি শুধু
        একটুক্ষণ সেটা লক্ষ্য করেছেন। যখন প্রস্তুত হবেন, আরেকটা শ্বাস
        নিন। আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।
      - >-
        আজকের জন্য আপনি যথেষ্ট দেখে ফেলেছেন। যা পেয়েছেন, ধরে রাখতে
        বা ছেড়ে দিতে আপনার অনুমতি আছে। যখন প্রস্তুত হবেন, আরেকটা
        শ্বাস নিন। আপনি যখন প্রস্তুত, তখনই এখন থেমে যেতে পারেন।
