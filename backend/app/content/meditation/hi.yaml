preface:
  default: >-
    शुरुआत से पहले एक छोटी बात। यह एक हल्की, स्वयं-निर्देशित अभ्यास है,
    चिकित्सा सलाह नहीं, और इलाज भी नहीं। आप किसी भी समय रुक सकते हैं —
    कुछ पूरा करने की ज़रूरत नहीं है, और यहाँ कुछ भी अपने-आप आगे नहीं
    बढ़ेगा। अगर किसी समय असहज लगने लगे, तो बस रुक जाएँ और जो सही लगे
    वही करें।
  unknown: >-
    शुरुआत से पहले एक छोटी बात। अगर आप गाड़ी चलाने वाले हैं, तो कृपया
    गाड़ी चलाते हुए यह अभ्यास न करें — पहले किसी सुरक्षित जगह पर गाड़ी
    रोकें। आप किसी भी समय रुक सकते हैं — कुछ पूरा करने की ज़रूरत नहीं है।
    यह स्वयं-निर्देशित अभ्यास है, चिकित्सा सलाह नहीं, और इलाज भी नहीं।
  walking: >-
    शुरुआत से पहले एक छोटी बात। आप चल रहे हैं, इसलिए आपका ध्यान आपके
    पास ही रहेगा: आँखें बंद नहीं, और रास्ते से नज़र नहीं हटाएँ। यह एक
    हल्की, स्वयं-निर्देशित अभ्यास है, चिकित्सा सलाह नहीं, और इलाज भी
    नहीं। आप किसी भी समय रुक सकते हैं — कुछ पूरा करने की ज़रूरत नहीं है।
  driving: >-
    शुरुआत से पहले सुरक्षा की एक बात। कृपया गाड़ी चलाते हुए यह अभ्यास न
    करें। अगर आप गाड़ी चला रहे हैं, तो पहले किसी सुरक्षित जगह पर गाड़ी
    रोकें, फिर यह शुरू करें। यह तब के लिए है जब आप स्थिर हों। आप किसी
    भी समय रुक सकते हैं, और यह स्वयं-निर्देशित अभ्यास है, चिकित्सा सलाह
    नहीं और इलाज भी नहीं।

eyes:
  open: >-
    चाहें तो आप आँखें खुली रख सकते हैं, नज़र आगे किसी शांत जगह पर रखी।
  closed: >-
    अगर आरामदायक लगे, तो आप अब आँखें बंद कर सकते हैं। अगर नहीं, तो नज़र
    आगे किसी शांत जगह पर मुलायम रखें।

stop:
  cue: >-
    आप किसी भी समय रुक सकते हैं, और जो निर्देश आपको सुविधाजनक न लगे, उसे
    छोड़ सकते हैं।
  closing: आप जब तैयार हों, तब अब रुक सकते हैं।

breath_cues:
  - >-
    आइए कुछ साधारण साँसें साथ में लें। नाक से अंदर, और मुँह से बाहर,
    जब तक वह स्वाभाविक न लगे। कोई गति मटाने की ज़रूरत नहीं है।
  - >-
    हल्की साँस अंदर लें, और साँस को धीरे-धीरे बाहर जाने दें। अगर साँस
    छोटी लगे, तो छोटी ही रहने दें। यहाँ किसी चीज़ को ज़बरदस्ती करने की
    ज़रूरत नहीं है।
  - >-
    अगली कुछ साँसों में, अगर आरामदायक लगे, तो साँस बाहर निकालने को
    साँस अंदर लेने से थोड़ी लंबी रखें। अगर नहीं, तो बस वैसे ही साँस लें
    जैसे आप हैं।
  - >-
    एक साँस को एक बार में महसूस करें। अंदर, और बाहर। आपका ध्यान भटकने
    दें, और जब वह लौटे, तो साँस पर लौटने दें।

themes:
  morning:
    openings:
      - >-
        सुप्रभात। इसका कोई विशेष स्थान पाने की ज़रूरत नहीं है। अगर आप
        अभी जहाँ हैं, दिन अभी शुरू नहीं हुआ है, तो आप बस यही समझकर शुरू
        कर सकते हैं कि आप यहाँ हैं।
      - >-
        सुप्रभात। दिन भर से पहले, यह पाँच मिनट सिर्फ़ आपके हैं। हम इसे
        आपकी मर्ज़ी से बिता सकते हैं — शांति में, और अपने ही गति पर।
    passages:
      - >-
        महसूस करें कि आप शरीर में कहाँ हैं। पैर, हथेलियाँ, शरीर का वज़न
        जहाँ ठहरा है। आपको इसके कुछ भी बदलने की ज़रूरत नहीं है। बस कुछ
        साँसों के लिए शरीर को मौजूद रहने दें।
      - >-
        आने वाला दिन अब हल करने की ज़रूरत नहीं है। आप उसे तब मिला करें,
        जब वह आए, एक-एक लम्हे में। अभी के लिए बस यह साँस है, और अगली
        साँस।
      - >-
        जो कुछ भी आप आज साथ ला रहे हैं, उसे एक साथ उठाने की ज़रूरत
        नहीं है। आप धीरे से शुरू कर सकते हैं, और छोटे से शुरू कर सकते
        हैं।
      - >-
        अगर दिन के बारे में कोई विचार आए, तो आने दें। उसके साथ बहस करने
        की ज़रूरत नहीं है, और उसे सही मानने की भी नहीं। आप उसे जाने दें,
        जैसे बादल जाते हैं।
    closings:
      - >-
        अभी के लिए यह कافي है। जब आप तैयार हों, एक और साँस लें — अंदर,
        और बाहर — और दिन में अपने ही गति पर लौट जाएँ। आप जब तैयार हों,
        तब अब रुक सकते हैं।
      - >-
        आपने यह पूरी अभ्यास बस यहाँ रहकर ही कर दी है। जब तैयार हों, एक
        और साँस लें, और सुबह में लौट जाएँ। आप जब तैयार हों, तब अब रुक
        सकते हैं।

  focus:
    openings:
      - >-
        यह आपके ध्यान के लिए एक छोटा ठहराव है। हम मन को खाली करने की
        कोशिश नहीं कर रहे — वह संभव नहीं है, और यह बिंदु भी नहीं है। हम
        बस आपके ध्यान को एक स्थान दे रहे हैं जहाँ वह आराम करे।
      - >-
        अगर आपका मन व्यस्त रहा है, तो यह वह जगह है जहाँ आप इसे थोड़ी
        देर के लिए रख सकते हैं। यहाँ कुछ भी हासिल करने की माँग नहीं है।
        एक ही काम है — समझना।
    passages:
      - >-
        अपना ध्यान अपने साँस की आवाज़ पर लाएँ। उसे बदलने की ज़रूरत नहीं
        है — बस कुछ साँसों के लिए उसे वह चीज़ बनाए रखें जिस पर आपका ध्यान
        है।
      - >-
        आप लगेगा कि आपका ध्यान भटक गया। यह साधारण है। जब आप यह समझें कि
        वह चला गया, तो उसे मुलायमी से, बिना दोष लगाए, वापस लाएँ। वह छोटा
        वापसी ही पूरी अभ्यास है।
      - >-
        अपनी नज़र को मुलायम रखें। अपने हाथों को आराम करने दें। दिन के
        बाकी हिस्से को थोड़ी देर इंतज़ार करने दें — वह अब तक इंतज़ार कर
        रहा है, और थोड़ा और कर सकता है।
      - >-
        अगर कोई चिंता आए, तो उसे मन में एक नाम दें — एक काम, एक संदेश,
        एक व्यक्ति — और फिर उसे रहने दें। अक्सर नाम देने से उसे इतना
        ध्यान मिल जाता है कि वह आराम कर सके।
    closings:
      - >-
        एक और साँस — अंदर, और बाहर। जब आप जो कर रहे थे, उसमें लौटें,
        तो आपको वैसे ही गति से करने की इज़ाज़त है जो आपको उचित लगे। आप
        जब तैयार हों, तब अब रुक सकते हैं।
      - >-
        अभी के लिए यह कافي है। आपका ध्यान आराम का एक लम्हा ले चुका है।
        जब तैयार हों, एक और साँस लें, और दिन में लौट जाएँ। आप जब तैयार
        हों, तब अब रुक सकते हैं।

  stress-release:
    openings:
      - >-
        जब शरीर में बहुत तनाव जमा होता है, तो वह आँख-मिलाने पर नहीं
        घुलता। इसलिए इसका मक़सद कुछ को ज़बरदस्ती शीतल करने का नहीं है।
        इसका मक़सद शरीर को वह जगह देना है जो वह पहले से जानता है।
      - >-
        अगर दिन भारी लगा है, तो यहाँ उसे सब कुछ उतारने की ज़रूरत नहीं।
        हम बस अपने शरीर को कुछ मिनट की शांति दे सकते हैं, और उसे रहने
        दें।
    passages:
      - >-
        समझें कि अभी तनाव शरीर में कहाँ बैठा है — कंधे, जबड़ा, हाथ,
        पेट। उसे नाम देने या ठीक करने की ज़रूरत नहीं है। बस एक-दो साँसों
        के लिए उसे समझने दें।
      - >-
        जैसे ही आप साँस बाहर निकालें, अगर कंधे चाहें, तो उन्हें थोड़ा
        नीचे जाने दें। अगर हाथ कसे हों, तो उन्हें खोलने दें। कुछ भी
        पूर्वी होने की ज़रूरत नहीं है — थोड़ा सा कافي है।
      - >-
        आपको इसे नीचे रखने की इज़ाज़त है। आज मन में जो रहा है, उसे अगले
        कुछ मिनटों के लिए उठाने की ज़रूरत नहीं है। आप इसे रख दें, और
        जब आप चुनें, तब बाद में उठा लें।
      - >-
        तनाव अक्सर अपने-आप हल्का हो जाता है, जब वह लड़ाई में पकड़ा
        जाने बंद कर दे। इसलिए बस साँस लें, और शरीर को अपने काम को
        अपनी गति पर करने दें।
    closings:
      - >-
        एक और धीमी साँस बाहर निकालें, और जो कुछ बाकी है, उसे वहीं
        रहने दें। आप जब तैयार हों, तब अब रुक सकते हैं, और दिन में अपने
        ही गति पर लौट सकते हैं।
      - >-
        अभी के लिए यह कافي है। शरीर को आराम करना पता है; आपने बस उसे
        मौक़ा दिया। जब तैयार हों, एक और साँस लें। आप जब तैयार हों, तब
        अब रुक सकते हैं।

  calm:
    openings:
      - >-
        यहाँ पहुँचने के लिए कुछ नहीं है, और किसी चीज़ को सुधारने के लिए
        भी कुछ नहीं है। यह बस कुछ मिनट हैं — वहीं रहने के, जहाँ आप
        हैं।
      - >-
        इसके लिए आपको और शीतल महसूस करने की ज़रूरत नहीं है। बस यहाँ
        होना, साँस लेना, कुछ मिनट के लिए — यह कافي है।
    passages:
      - >-
        आस-पास की आवाज़ें समझें। दूर और पास, आती-जाती। उन्हें पहचानने की
        ज़रूरत नहीं है। उन्हें वह आवाज़ रहने दें जो आपकी जगह की आवाज़ है।
      - >-
        समझें कि आपका शरीर जहाँ सहारा पा रहा है, वहाँ उसका वज़न है।
        कुर्सी, ज़मीन, मिट्टी। इस मिनट आपको खुद को सने की ज़रूरत नहीं
        है।
      - >-
        विचार आएंगे, और वह ठीक है। उन्हें धकेलने की ज़रूरत नहीं है, न
        ही उन्हें पीछे करने की। बस समझें, और साँस को आगे बढ़ने दें।
      - >-
        अगर हो सके, तो साँस को ज़रूरत से थोड़ी धीमी रखें। ज़बरदस्ती
        नहीं — बस अनुमति दी गई। अंदर, और बाहर, उस गति पर जो सही लगे।
    closings:
      - >-
        आप जब चाहें दिन में लौट सकते हैं। एक और साँस लें — अंदर, और
        बाहर — और अगर आप चाहें, तो इसकी बाकी चीज़ आप साथ रखें। आप जब
        तैयार हों, तब अब रुक सकते हैं।
      - >-
        अभी के लिए यह कافي है। यहाँ कुछ भी अनिवार्य नहीं था, और आपने
        सब कुछ कर लिया है। जब तैयार हों, एक और साँस लें। आप जब तैयार
        हों, तब अब रुक सकते हैं।

  sleep:
    openings:
      - >-
        यह एक धीमा होने का समय है, कोई परीक्षा नहीं। अगर आप सो जाएँ, तो
        वह सफलता है, असफलता नहीं। अगर न सोएँ, तो वह भी ठीक है। यह बस
        नींद से पहले कुछ शांत मिनट हैं।
      - >-
        दिन खत्म हो चुका है, और इस रात वह आपसे और कुछ नहीं माँगता। हम
        इन मिनटों को और शांत होते देख सकते हैं, जैसे कमरा शांत हो जाता
        है जब बत्तियाँ बुझती हैं।
    passages:
      - >-
        अपने ध्यान को अपने हाथों से शुरू करें। उंगलियाँ, हथेलियाँ, कलाई
        । वहाँ कुछ करने को नहीं है — बस कुछ साँसों के लिए उन्हें भारी और
        गरम रहने दें।
      - >-
        ध्यान को कंधों तक ले जाएँ। उन्हें इतने मुलायम रहने दें जितना
        हो सके। अगर कोई कंधा उठना चाहता है, तो उठने दें। अगर नीचे
        जाना चाहता है, तो जाने दें।
      - >-
        साँस को अपना लय ढूँढने दें। गिनने, ढालने या ठीक करने की ज़रूरत
        नहीं है। अंदर, और बाहर। साँस को पहले से पता है कि क्या करना है।
      - >-
        अगर रात को विचार आएँ, तो उन्हें जवाब देने की ज़रूरत नहीं है।
        उन्हें आने-जाने दें, जैसे एक शांत खिड़की से बाहर ट्रैफिक निकलता
        है। आप शांत हिस्से में हैं।
    closings:
      - >-
        आप इसे अब छोड़ सकते हैं, और रात को अपना काम करने दें। एक और
        साँस — अंदर, और बाहर — और अगर आरामदायक लगे, तो खुद को
        आराम करने दें। आप जब तैयार हों, तब अब रुक सकते हैं।
      - >-
        अभी के लिए यह कافي है। रात का बाकी हिस्सा आपका है, और वह
        आपसे कुछ नहीं माँगता। आप जब तैयार हों, तब अब रुक सकते हैं।

  gratitude:
    openings:
      - >-
        यह आज के अच्छे हिस्सों को देखने के लिए एक छोटा ठहराव है। उन्हें
        बड़े होने की ज़रूरत नहीं है। छोटी चीज़ें गिनती में आती हैं, और
        शांत चीज़ें भी।
      - >-
        इसके काम करने के लिए आपको कृतज्ञ महसूस करने की ज़रूरत नहीं।
        बस कुछ मिनट चाहिए, जो अच्छा था उसे ढूँढने के लिए, उस गति पर जो
        मुलायम लगे।
    passages:
      - >-
        आज की एक छोटी चीज़ पर विचार करें जो ठीक थी, या ठीक से बेहतर।
        वह खाना हो सकता है, संदेश, मौसम का एक टुकड़ा। उसे उतना छोटा
        रहने दें जितना ज़रूरी हो।
      - >-
        अगर हो सके, तो एक ऐसे व्यक्ति को समझें जिसने आज को थोड़ा आसान
        बनाया। कुछ कहने की ज़रूरत नहीं है, और कुछ करने की भी नहीं। बस
        उन्हें समझने दें।
      - >-
        एक चीज़ पर विचार करें जो आपके शरीर ने आज आपके लिए की — आपको
        चलाना, गर्म करना, स्वाद लेना। वह चुपचाप काम कर रहा है, और आपको
        उसे समझने की इज़ाज़त है।
      - >-
        अगर दिन ज़्यादा मुश्किल था, तो वह ईमानदार बात है, और वह मानी
        जाती है। आप फिर भी एक छोटी चीज़ को समझ सकते हैं जो बुरी नहीं थी
        — एक गिलास पानी, एक मिनट की शांति, एक मुश्किल लम्हे का खत्म
        होना।
    closings:
      - >-
        अभी के लिए यह कافي है। आपको इसके किसी हिस्से को पकड़े रखने
        की ज़रूरत नहीं — आपने बस इसे थोड़ी देर समझा है। जब तैयार हों,
        एक और साँस लें। आप जब तैयार हों, तब अब रुक सकते हैं।
      - >-
        आज के लिए आपने कافي देखा है। जो भी मिला, उसे रखने या जाने
        देने का अधिकार आपका है। जब तैयार हों, एक और साँस लें। आप जब
        तैयार हों, तब अब रुक सकते हैं।
