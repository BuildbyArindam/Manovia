# Alembic configuration for the Manovia backend.
# Run migrations from the backend/ directory: `alembic upgrade head`.

[alembic]
# Script location, relative to this file.
script_location = alembic

# Make `app` importable when alembic runs from backend/.
prepend_sys_path = .

# Single migrations directory; `os` avoids the legacy path-splitting warning.
path_separator = os

# The database URL is NOT stored here: env.py reads DATABASE_URL through
# app.core.config.Settings, so migrations and the app can never disagree.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
