[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manovia-backend"
version = "1.0.0"
description = "Manovia backend API (FastAPI + data layer)"
readme = "README.md"
requires-python = ">=3.11"
# Day 22: exact pins, not lower bounds. Every version below is one that this
# repository's full test suite actually ran against (2026-10-12). A lower bound
# means each `pip install` resolves a different tree than the one that was
# tested, which is the wrong default for a security-sensitive service: a
# yanked-and-republished or silently-changed transitive dependency is a supply
# chain event, not an upgrade. Deliberately *not* pinned: the optional extras
# below (nlp/llm/ner/rag), because CI never installs them, so any number written
# there would be a guess. Pin them at install time instead:
#   pip install -e ".[dev,llm]" && pip freeze > constraints-llm.txt
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    # Day 27: production process model. Gunicorn manages the worker processes
    # (lifecycle, graceful restart, heartbeats); uvicorn-worker is the
    # maintained UvicornWorker the config runs (uvicorn's own
    # `uvicorn.workers` module is deprecated upstream).
    "gunicorn==26.2.0",
    "uvicorn-worker==0.4.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    # [asyncio] pulls in greenlet, which SQLAlchemy's async sessions require.
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    # Async drivers for the two supported backends (see app/db/session.py).
    "aiosqlite==0.22.1",
    "asyncpg==0.32.0",
    # Fernet field encryption (see app/core/crypto.py).
    "cryptography==50.0.2",
    # Password hashing (argon2id) for the accounts milestone (Day 4).
    "argon2-cffi==25.1.0",
    # JWT access/refresh tokens (HS256, see app/core/tokens.py).
    "pyjwt==2.15.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
    # Language detection for the NLP service (Day 6). Pure Python, offline,
    # and its profile data ships in the wheel, so it adds no network calls.
    "langdetect==1.0.9",
    # Safety pattern data (Day 8). The rules engine reads YAML so that patterns
    # can be reviewed and extended without touching code; jsonschema validates
    # the shipped helpline file against its published contract at import time.
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    # Safety ML classifier (Day 9). The baseline model is TF-IDF + logistic
    # regression, trained offline from evals/datasets and committed as an
    # artifact under app/ml_artifacts/ — no network at load or predict time.
    "scikit-learn==1.9.1",
    # Knowledge retrieval (Day 13). The vector store is FAISS (flat exact
    # search over CPU vectors), imported eagerly by app.services.rag.store,
    # so it is a hard dependency like any other storage engine. Small CPU
    # wheel, no torch; the *model* that embeds (sentence-transformers) stays
    # optional in the `rag` extra — the offline tfidf path needs only this.
    "faiss-cpu==1.15.1",
    # Day 27 observability: Prometheus counters/histograms for request rate,
    # latency, error rate, safety events by level, LLM fallback rate and
    # output-guard block rate. Small, offline, no agent process.
    "prometheus-client==0.26.0",
    # Day 27 error reporting. Opt-in via SENTRY_DSN (no DSN = no network, so
    # the offline suite and self-hosted deploys never contact Sentry). Every
    # event passes the privacy scrubber in app/core/sentry.py.
    "sentry-sdk==2.72.0",
    # Day 40's local VAD. The standard `webrtcvad` module comes from this
    # prebuilt wheel, avoiding a compiler requirement in the API image.
    "webrtcvad-wheels==2.0.14.post1",
    # Day 47 clinician-share bridge. reportlab renders the printable summary
    # (app/services/sharing/pdf.py). It is a *base* dependency, not an extra:
    # creating a share with format=pdf is part of the shipped feature, and the
    # module is imported eagerly by the share service — an absent reportlab
    # would be a 500 on a documented endpoint. Pure Python, offline, no fonts
    # downloaded at runtime (only the built-in Helvetica metrics are used, which
    # is why non-Latin text is transliterated with an on-page note).
    # It does pull two transitive wheels that the image did not have before:
    # pillow 13.0.0 (image embedding, unused by this feature but a hard
    # requirement in reportlab's metadata) and charset-normalizer 3.5.2. Both
    # were pip-audited clean on 2026-10-20 at those exact versions.
    "reportlab==5.0.1",
]

[project.optional-dependencies]
# Emotion model runtime (Day 6). Deliberately NOT a base dependency: the test
# suite, CI and any deployment without a model must be able to import
# app.services.nlp and get the lexicon fallbacks. Install with
#   pip install -e ".[dev,nlp]"
# For a CPU-only torch (much smaller than the default CUDA-enabled wheel) use
# the extra index from https://pytorch.org/get-started/locally/.
nlp = [
    "transformers>=4.44.0",
    "torch>=2.2.0",
]
# LLM providers (Day 10). Deliberately NOT base dependencies: the offline test
# suite, CI and any deployment that routes through Ollama or the Fake must be
# able to import app.services.llm without a hosted vendor's SDK. The Anthropic
# provider imports its SDK lazily and raises ProviderNotAvailable when it is
# missing, so the chain simply falls through to the next link.
#   pip install -e ".[dev,llm]"
llm = [
    "anthropic>=0.40.0",
]
# Optional person-name redaction (LLM_REDACT_NAMES). Off by default and never
# imported eagerly: app.services.nlp.redaction.SpacyNameFinder degrades to
# "finds nothing" when this is absent.
ner = [
    "spacy>=3.7.0",
]
# Semantic embeddings for the knowledge base (Day 13). Deliberately NOT a base
# dependency: it pulls torch (a multi-GB wheel), and the offline path — the
# corpus-fitted TF-IDF embedder — needs nothing beyond the base install. With
# the extra installed and RAG_EMBEDDER=auto/sentence_transformers, the
# checkpoint in RAG_EMBEDDING_MODEL_ID is downloaded from Hugging Face on
# first use. See docs/adr/0013-knowledge-retrieval-rag.md.
#   pip install -e ".[dev,rag]"
rag = [
    "sentence-transformers>=2.7.0",
]
# Compressed-model serving (Day 34). Deliberately NOT a base dependency:
# the API must import and serve rules+baseline without the ONNX runtime,
# and app.services.ml_runtime imports it lazily. Install with
#   pip install -e ".[dev,serving]"
serving = [
    "onnxruntime>=1.20.0",
]
voice = [
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
]
dev = [
    # Pinned deliberately: `python -m venv` seeds whatever setuptools the OS
    # happened to ship, and pip-audit audits *that* too. On this machine the
    # seeded 66.1.1 carried PYSEC-2026-3447 (a MANIFEST.in exclusion bypass that
    # only matters when building an sdist) and the dependency-audit gate failed
    # on it — correctly, since the gate has no severity filter. A dev extra that
    # upgrades it is the fix that keeps the gate strict.
    "setuptools==83.0.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "hypothesis==6.169.0",
    # Day 47: pypdf reads the rendered share PDF back as text so the tests can
    # assert on the banner, the section order and the page footers instead of
    # trusting reportlab's layout. Test-only — the app never parses a PDF, it
    # only writes one, so this stays out of the base dependencies.
    "pypdf==6.21.1",
    # mypy --strict needs stubs for the YAML loader.
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Helpline + consent content, its schema, the localised crisis templates and the
# safety pattern YAML. Without these the installed wheel imports but crashes on
# first load.
# Day 10 adds the versioned system prompts (prompts/*.md). A missing prompt
# file is a startup error by design, so it must be in the wheel.
# Day 16 adds the localised insight templates (insights/*.json): they are the
# sentences a person reads about their own numbers, and a missing file is a
# startup error rather than a blank panel.
# Day 47 adds the verified LOINC terms (sharing/loinc.json) the FHIR share
# bundle codes assessments with. The loader raises TerminologyError when the
# file is missing, so it has to be in the wheel: a share without it could not
# be built at all, and inventing codes is exactly what the file exists to
# prevent (see docs/adr/0047-clinician-share-bridge.md).
"app.content" = ["*.json", "safety/*.yaml", "exercises/*.yaml", "i18n/*.json", "insights/*.json", "prompts/*.md", "assessments/*.json", "sharing/*.json"]
# Day 44: the curated support directory and its schema, read by the
# agentic navigator and the read-only MCP server.
"app.content.resources" = ["*.json"]
# Day 9 safety ML artifact (trained offline from evals/datasets; see
# evals/train_safety_classifier.py). Missing artifact degrades to rules-only.
"app.ml_artifacts.crisis_v1" = ["model.joblib", "metadata.json"]
# Day 35 retrieval calibration (fusion weight, abstain floors, split
# fingerprints), written by ml/src/manovia_ml/retrieval/tuning.py. A missing file
# degrades to the documented defaults with a `rag_tuning_missing` warning rather
# than failing startup, but a deployment without it is serving untuned numbers.
"app.ml_artifacts.retrieval_v1" = ["tuning.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `model` tests need the real Hugging Face model and therefore network access;
# the default run (and `make test`) excludes them so the suite stays offline.
# `pytest -m model` overrides the addopts selection and runs only those.
markers = [
    "model: requires the real emotion model (network + the nlp extra)",
]
addopts = "-ra -m 'not model'"

[tool.coverage.run]
# SQLAlchemy's async sessions resume coroutine frames from greenlets, and
# FastAPI runs sync dependencies/endpoints in worker threads; without these,
# coverage silently drops line events (and under some source filters the
# compiled SQLAlchemy cache-key module even crashes mid-run —
# coveragepy#2324). One line each, honest numbers.
concurrency = ["greenlet", "thread"]
# Day 26: branches, not just lines. A line count is satisfied by a happy-path
# test that executes every statement and never enters a single ``if`` body, and
# `scripts/coverage_gate.py` gates the safety, crypto and scoring modules on
# both. Measuring branches only where the day's targets ask for them would mean
# two different runs with two different configs, so it is on for the whole suite.
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# The LLM error names are the ones the Day 10 brief asks for (Timeout,
# RateLimited, ProviderDown). They read as *conditions* rather than as types,
# which is exactly how the retry machinery reads them, and N818's "Error"
# suffix would make that code noisier for no gain. Domain naming wins here.
"app/services/llm/base.py" = ["N818"]
"app/api/**/*.py" = ["B008"]
# EmbedderUnavailable reads as a condition (the embedder is unavailable
# here), exactly like the LLM provider errors above; same reasoning, same
# waiver.
"app/services/rag/base.py" = ["N818"]
# CrossEncoderUnavailable is the Day-35 sibling of EmbedderUnavailable: it
# names the condition the factory branches on (fall back to the untrained
# scorer), not a type of failure. Same waiver, same reasoning.
"app/services/rag/rerank.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Third-party modules with no type information. langdetect ships no stubs;
# transformers/torch are imported lazily inside app/services/nlp/hf.py.
[[tool.mypy.overrides]]
module = [
    "langdetect.*", "transformers.*", "torch.*", "anthropic.*", "spacy.*", "faster_whisper.*",
    "faiss.*", "sentence_transformers.*", "sklearn.*", "joblib.*",
    # Day 44: jsonschema validates the agent's tool arguments and
    # the directory file; it ships no inline types and the stubs
    # package is not a dependency.
    "jsonschema.*",
    # Day 27: gunicorn config/worker and the observability stack below.
    # "manovia_worker.*" is checked here (it subclasses the untyped worker).
    "uvicorn_worker.*", "gunicorn.*", "prometheus_client.*", "sentry_sdk.*",
    "manovia_worker.*", "gunicorn.conf",
]
ignore_missing_imports = true
follow_imports = "skip"
# AccessLogFreeUvicornWorker subclasses the (untyped) UvicornWorker.
disallow_subclassing_any = false

# Day 34: onnxruntime/onnx are imported lazily inside app/services/ml_runtime
# and its tests, and are only installed with the `serving` extra. Scoped to
# those two modules on purpose: an earlier draft also listed numpy.* here,
# which stopped mypy from using numpy's real stubs everywhere and broke
# previously-clean modules (rag/store.py) under CI's Python 3.12 — numpy
# must stay fully typed.
# Day 47: reportlab renders the printable share summary. It ships no inline
# types and no stub package is a dependency here (types-reportlab covers only
# part of platypus), so the drawing calls are treated as Any — the shapes that
# matter are asserted in tests/unit/test_share_pdf.py instead.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
follow_imports = "skip"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnxruntime", "onnx.*", "onnx"]
ignore_missing_imports = true
follow_imports = "skip"
disallow_subclassing_any = false
disallow_untyped_calls = false
