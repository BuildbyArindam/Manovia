[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manovia-backend"
version = "0.1.0"
description = "Manovia backend API (FastAPI + data layer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # [asyncio] pulls in greenlet, which SQLAlchemy's async sessions require.
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    # Async drivers for the two supported backends (see app/db/session.py).
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    # Fernet field encryption (see app/core/crypto.py).
    "cryptography>=42.0.0",
    # Password hashing (argon2id) for the accounts milestone (Day 4).
    "argon2-cffi>=23.1.0",
    # JWT access/refresh tokens (HS256, see app/core/tokens.py).
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
nlp = ["transformers>=4.45,<5", "torch>=2.4"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
    "mypy>=1.10.0",
    "hypothesis>=6.100.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.content" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["model: optional real HF download/inference (excluded from make test)"]

[tool.coverage.run]
# SQLAlchemy's async sessions resume coroutine frames from greenlets, and
# FastAPI runs sync dependencies/endpoints in worker threads; without these,
# coverage silently drops line events (and under some source filters the
# compiled SQLAlchemy cache-key module even crashes mid-run —
# coveragepy#2324). One line each, honest numbers.
concurrency = ["greenlet", "thread"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
