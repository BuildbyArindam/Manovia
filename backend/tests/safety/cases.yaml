  # ------------------------------------------------------------------ #
  # Combinations: two signals in one message                            #
  # ------------------------------------------------------------------ #
  - id: mix-001
    group: combination
    text: "this exam is killing me and i want to die"
    level: high
    categories: [suicidal_ideation]
    note: >-
      The figurative clause must not explain away the real one. Suppression is per
      occurrence, never per message.

  - id: mix-002
    group: combination
    text: "i feel hopeless and i have started planning"
    level: high
    note: >-
      High, not imminent: hopeless (medium) plus started planning (high) takes the
      maximum, and the imminent upgrade needs a timeframe or a means on top of
      intent. Neither is present.

  - id: mix-003
    group: combination
    text: "i cut myself and i want to die"
    level: high
    categories: [self_harm, suicidal_ideation]

  - id: mix-004
    group: combination
    text: "i am a burden and nobody would notice if i was gone"
    level: high

  - id: mix-005
    group: combination
    text: "i dont want to die but i cannot go on like this"
    level: high
    note: "A negated clause plus a real one: the real one decides."

  - id: mix-006
    group: combination
    text: "he hit me again and i want to disappear"
    level: high
    categories: [abuse_disclosure, suicidal_ideation]

  - id: mix-007
    group: combination
    text: "i have a plan, i got what i need, and i said goodbye to my sister"
    level: high
    note: >-
      High, not imminent, for the same reason as am-001: "what i need" names no
      means. Plan plus goodbyes is serious and gets the crisis card; the engine
      will not claim imminence it cannot evidence.

  - id: mix-008
    group: combination
    text: "my friend wants to die and i do not know how to help her"
    level: high
    third_person: true
