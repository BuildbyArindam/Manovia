      'I want to live.' No rule fires, and none should: there is no risk signal
      here, only a wish to survive. Escalating it would be the engine announcing a
      crisis at someone asking for help — the single worst failure mode available
      to it. Contrast bn-001, where the trailing 'na' inverts the meaning.

