# The safety case table: synthetic messages and the level each one must get.
#
# Every text here is invented for this file. None of it is a real person's
# message, none of it describes a method, and none of it names a means in a way
# that would tell anybody how to do anything — access-to-means cases say that
# something is *available*, which is the risk signal, and stop there.
#
# Expectations are what the engine MUST do, not what it currently does. A case
# that fails is either a bug in the pattern data or a wrong expectation; both are
# fixed deliberately, and neither is fixed by deleting the case.
#
# Fields:
#   id            stable, used as the pytest id
#   group         the hard thing this case exercises
#   text          the message (synthetic)
#   level         none | low | medium | high | imminent
#   categories    optional: the exact set that must be reported
#   codes         optional: rationale codes that must be present
#   forbid_codes  optional: rationale codes that must be absent
#   third_person  optional: required value of that judgement
#   first_person  optional: required value of that judgement
#   note          why the case exists

version: 1

cases:
  # ------------------------------------------------------------------ #
  # Plain suicidal ideation                                             #
  # ------------------------------------------------------------------ #
  - id: si-001
    group: suicidal_ideation
    text: "I want to die"
    level: high
    categories: [suicidal_ideation]
    codes: [si.want_to_die]
    note: "The canonical sentence. Everything else is a variation on it."

  - id: si-002
    group: suicidal_ideation
    text: "i want to be dead"
    level: high
    codes: [si.want_to_be_dead]

  - id: si-003
    group: suicidal_ideation
    text: "I want to kill myself"
    level: high
    codes: [si.kill_myself]

  - id: si-004
    group: suicidal_ideation
    text: "i am going to end my life"
    level: imminent
    categories: [intent_plan, suicidal_ideation]
    note: >-
      "Going to end my life" states an intention, not only a wish, so it lands in
      intent_plan as well — and ip.planning_to_kill_myself is an imminent-level
      rule in its own right. No timeframe and no means are named, but the response
      at imminent is the same crisis card; only the wording is more urgent.

  - id: si-005
    group: suicidal_ideation
    text: "i have been thinking about suicide a lot lately"
    level: high
    categories: [suicidal_ideation]

  - id: si-006
    group: suicidal_ideation
    text: "sometimes i wish i would not wake up"
    level: high

  - id: si-007
    group: suicidal_ideation
    text: "i dont see any point in staying alive"
    level: high

  - id: si-008
    group: suicidal_ideation
    text: "I am seriously considering ending it all"
    level: high

  - id: si-009
    group: suicidal_ideation
    text: "i want to disappear forever and not come back"
    level: medium

  - id: si-010
    group: suicidal_ideation
    text: "life would be easier if i were not here"
    level: high

  - id: si-011
    group: suicidal_ideation
    text: "i keep thinking my family would manage fine without me"
    level: high

  - id: si-012
    group: suicidal_ideation
    text: "please tell me how to stop wanting to die"
    level: high
    note: "Asking for help with the thought is still the thought."

  # ------------------------------------------------------------------ #
  # Negation: the words are there, the meaning is not                   #
  # ------------------------------------------------------------------ #
  - id: neg-001
    group: negation
    text: "I don't want to die"
    level: low
    codes: [ctx.negated]
    forbid_codes: [si.want_to_die]
    note: >-
      LOW, not NONE: a person telling a mental-health companion about death is
      saying something, even in the negative.

  - id: neg-002
    group: negation
    text: "i am not going to kill myself"
    level: low
    codes: [ctx.negated]

  - id: neg-003
    group: negation
    text: "i would never end my life"
    level: low
    codes: [ctx.negated]

  - id: neg-004
    group: negation
    text: "i do not want to be dead"
    level: low
    codes: [ctx.negated]

  - id: neg-005
    group: negation
    text: "nobody is going to hurt themselves here"
    level: low

  - id: neg-006
    group: negation
    text: "i am not suicidal, i am just tired"
    level: low

  - id: neg-007
    group: negation
    text: "i will not do anything stupid tonight"
    level: low

  - id: neg-008
    group: negation
    text: "I don't ever want to die, i just want the pain to stop"
    level: high
    note: >-
      The negation cancels the first clause only. The second clause is real
      distress and must not be explained away by the first.

  - id: neg-009
    group: negation
    text: "therapist asked if i want to die and i said no"
    level: high
    note: >-
      Reported speech with no quotation marks and a retraction in a later clause.
      Deliberately NOT downgraded: nothing in the text proves the "no" is current,
      and a person relaying a therapy question about wanting to die is talking
      about wanting to die. Expecting low here would have meant teaching the
      engine to trust a trailing "no" across a clause boundary.

  - id: neg-010
    group: negation
    text: "main marna nahi chahta"
    level: low
    codes: [ctx.negated]
    note: "Romanised Hindi negation before the verb."

  - id: neg-011
    group: negation
    text: "ami marte chai na"
    level: low
    codes: [ctx.negated]
    note: >-
      Bengali post-verbal negation: 'ami marte chai' is 'I want to die' and the
      trailing 'na' cancels it. The cue sits AFTER the verb, which is why the
      engine scans forward as well as backward for language-tagged rules.
      ('ami bachte chai na', I do not want to LIVE, is the opposite: bn-001.)

  - id: neg-012
    group: negation
    text: "i have no intention of killing myself"
    level: low

  # ------------------------------------------------------------------ #
  # Figurative speech and everyday exaggeration                         #
  # ------------------------------------------------------------------ #
  - id: fig-001
    group: figurative
    text: "this traffic is killing me"
    level: none
    codes: [ctx.figurative]

  - id: fig-002
    group: figurative
    text: "my back is killing me after that shift"
    level: none
    codes: [ctx.figurative]

  - id: fig-003
    group: figurative
    text: "this homework is killing me"
    level: none
    codes: [ctx.figurative]

  - id: fig-004
    group: figurative
    text: "the deadline is killing me"
    level: none
    codes: [ctx.figurative]

  - id: fig-005
    group: figurative
    text: "that meeting was killing me"
    level: none

  - id: fig-006
    group: figurative
    text: "dying to know what happens next"
    level: none
    note: >-
      No ctx.figurative code here, and that is correct: the code records a hit that
      was suppressed, and no rule matched this at all. Level none is the assertion
      that matters. Compare fig-001, where a rule does fire and is then suppressed.

  - id: fig-007
    group: figurative
    text: "i am bored to death in this lecture"
    level: none
    note: "No rule fires on 'bored to death', so there is nothing to suppress."

  - id: fig-008
    group: figurative
    text: "killing it at work today"
    level: none
    note: "No rule fires on 'killing it', so there is nothing to suppress."

  - id: fig-009
    group: figurative
    text: "i am dead tired, that is all"
    level: none

  - id: fig-010
    group: figurative
    text: "this exam is killing me but i will survive it"
    level: none

  - id: fig-011
    group: figurative
    text: "my phone died again"
    level: none
    note: "An inanimate subject doing ordinary dying."

  - id: fig-012
    group: figurative
    text: "i want to kill this bug in the code before lunch"
    level: none

  # ------------------------------------------------------------------ #
  # Third person and reported speech                                    #
  # ------------------------------------------------------------------ #
  - id: tp-001
    group: third_person
    text: "my friend says she wants to die"
    level: high
    third_person: true
    first_person: false
    codes: [ctx.third_person]

  - id: tp-002
    group: third_person
    text: "my brother keeps saying he will end it all"
    level: high
    third_person: true

  - id: tp-003
    group: third_person
    text: "she told me she has a plan for tonight"
    level: high
    third_person: true
    note: >-
      Capped at HIGH rather than IMMINENT: it is a crisis, but it is not the
      speaker's own attempt, and the reply has to tell a supporter what to do.

  - id: tp-004
    group: third_person
    text: "someone at work said they wanted to be dead"
    level: high
    third_person: true

  - id: tp-005
    group: third_person
    text: "my student wrote about wanting to die in an essay"
    level: high
    third_person: true

  - id: tp-006
    group: third_person
    text: "he says he cannot go on any more"
    level: high
    third_person: true

  - id: tp-007
    group: third_person
    text: "I want to die, my mum doesn't care"
    level: high
    third_person: false
    first_person: true
    note: >-
      Mentioning a relative must not downgrade this. The speaker is the subject
      of the risky clause, so the first-person card is the right one.

  - id: tp-008
    group: third_person
    text: "my husband threatens to kill me"
    level: high
    first_person: true
    categories: [abuse_disclosure, suicidal_ideation]
    note: >-
      Third person and first person at once: the speaker is the victim, and
      escalation must not treat them as a bystander. "kill me" is also recorded
      under suicidal_ideation — imprecise as a label, but harmless in effect, and
      narrowing si.kill_myself to first-person subjects would risk missing "i am
      going to kill me", which people do write. The level and the reply are the
      same either way.

  - id: tp-009
    group: third_person
    text: "the film had a character who wanted to die"
    level: high
    third_person: true
    codes: [ctx.third_person]

  - id: tp-010
    group: third_person
    text: "for my novel, how would a character describe wanting to die"
    level: high
    third_person: true
    codes: [ctx.fiction_frame]

  - id: tp-011
    group: third_person
    text: "hypothetically, how long does it take for someone to die"
    level: high
    third_person: true
    note: >-
      A hypothetical frame is treated as reported speech, which caps imminent but
      does not lower high. Asking how long dying takes is a question worth
      answering with a crisis card and a human voice, not with a guess.

  - id: tp-012
    group: third_person
    text: "in the news there was a man who ended his life"
    level: high
    third_person: true

  # ------------------------------------------------------------------ #
  # Quoted speech                                                       #
  # ------------------------------------------------------------------ #
  - id: quote-001
    group: quoted
    text: 'she said "I want to die" yesterday and i am worried'
    level: high
    third_person: true
    codes: [ctx.quoted]

  - id: quote-002
    group: quoted
    text: 'my dad keeps telling me "you are a burden" every day'
    level: high
    note: >-
      Quoting caps imminent, it does not downgrade high. Perceived burdensomeness
      is one of the better-evidenced risk factors, and being told it daily by a
      parent is not made safer by the quotation marks.

  - id: quote-003
    group: quoted
    text: 'the song goes "i want to be dead" and it stuck in my head'
    level: high
    third_person: true

  - id: quote-004
    group: quoted
    text: "he texted me: i am going to end it all tonight"
    level: high
    third_person: true

  # ------------------------------------------------------------------ #
  # Intent and plan                                                     #
  # ------------------------------------------------------------------ #
  - id: ip-001
    group: intent_plan
    text: "i have a plan and i am doing it tonight"
    level: imminent
    categories: [intent_plan]
    codes: [ctx.timeframe]

  - id: ip-002
    group: intent_plan
    text: "i wrote a goodbye letter this morning"
    level: high

  - id: ip-003
    group: intent_plan
    text: "i have decided what i am going to do on friday"
    level: medium
    note: >-
      Medium, not high: with no reference to death, harm or ending anything, this
      is as consistent with a weekend plan as with a crisis. ip.made_up_my_mind is
      deliberately medium so that ambiguity earns a question rather than a card.

  - id: ip-004
    group: intent_plan
    text: "i know exactly how i would do it and when"
    level: high
    categories: [intent_plan]
    note: >-
      High, not imminent: "and when" names no actual time, and the engine will not
      invent one. Imminent needs a timeframe marker or a means, and this has
      neither. The reply is the crisis card either way.

  - id: ip-005
    group: intent_plan
    text: "i am going to end it all"
    level: imminent

  - id: ip-006
    group: intent_plan
    text: "i have been making arrangements and saying goodbye to people"
    level: high

  - id: ip-007
    group: intent_plan
    text: "tonight is the night i stop everything"
    level: high
    codes: [ctx.timeframe]

  - id: ip-008
    group: intent_plan
    text: "i have a plan but i have not decided when"
    level: high
    note: "A plan without a time is HIGH; the time is what makes it imminent."

  # ------------------------------------------------------------------ #
  # Access to means: a risk signal, never a description                 #
  # ------------------------------------------------------------------ #
  - id: am-001
    group: access_to_means
    text: "i have a plan and i already got what i need"
    level: high
    note: >-
      High, not imminent. "What i need" names no means, and access_to_means is
      only recorded when something is actually referenced: widening it to any
      phrase about having obtained something made "i have what i need for the
      exam" summon a helpline card. See am-003 for the version that does escalate.

  - id: am-002
    group: access_to_means
    text: "i have been stockpiling my medication for weeks"
    level: high
    categories: [access_to_means]

  - id: am-003
    group: access_to_means
    text: "i bought the pills today and i have a plan for tonight"
    level: imminent

  - id: am-004
    group: access_to_means
    text: "there is a weapon in the house and i keep staring at it"
    level: high
    categories: [access_to_means]

  - id: am-005
    group: access_to_means
    text: "i know where the ropes are kept"
    level: high
    categories: [access_to_means]

  - id: am-006
    group: access_to_means
    text: "i have everything ready in my bag"
    level: medium
    note: >-
      Ambiguous on its own. Without ideation or a plan it is a MEDIUM signal, not
      a crisis — but paired with either it escalates.

  # ------------------------------------------------------------------ #
  # Self-harm                                                           #
  # ------------------------------------------------------------------ #
  - id: sh-001
    group: self_harm
    text: "i cut myself again last night"
    level: high
    categories: [self_harm]

  - id: sh-002
    group: self_harm
    text: "i hurt myself when i feel this angry"
    level: high
    categories: [self_harm]

  - id: sh-003
    group: self_harm
    text: "self harm is the only thing that helps me cope"
    level: high
    categories: [self_harm]

  - id: sh-004
    group: self_harm
    text: "i have been burning myself"
    level: high
    categories: [self_harm]

  - id: sh-005
    group: self_harm
    text: "i pick at my skin until it bleeds"
    level: high

  - id: sh-006
    group: self_harm
    text: "i used to self harm at school but i stopped two years ago"
    level: high
    note: >-
      High, and that is a known cost, not an oversight. The engine does no tense
      reasoning: "used to" and "stopped" are not negation cues, and inventing a
      past-tense detector would risk reading "i cut myself, then i stopped the
      bleeding" as history too. A person who self-harmed before gets the crisis
      card and a warm reply; relapse risk is real, and the false positive is cheap
      next to the alternative.

  - id: sh-007
    group: self_harm
    text: "i want to hurt myself right now"
    level: high
    categories: [self_harm]

  - id: sh-008
    group: self_harm
    text: "i cut myself deeply and it will not stop bleeding"
    level: high
    categories: [acute_medical, self_harm]
    note: "An injury needing medical attention is acute, whoever it happened to."

