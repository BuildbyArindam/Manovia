# Day 35: the evaluation. Reads the test split; writes ml/reports/day35-retrieval.md.
#
# Nothing in this file is fitted. Every number here (fusion weight, abstain
# threshold, encoder, reranker coefficients) was chosen on dev or calibration by
# configs/retrieval_hybrid.yaml and arrives through
# backend/app/ml_artifacts/retrieval_v1/tuning.json. The report prints the split
# fingerprints next to the tables so a reader can check that claim.
name: retrieval_eval

seed: 20261014

notes: >-
  Test-split evaluation of every retrieval setting, with per-language slices,
  bootstrap CIs, latency percentiles, the abstain decision's precision/recall,
  and the failure cases of the recommended setting.

data:
  eval_set: data/retrieval/expanded.jsonl
  splits_dir: data/retrieval_splits
  chunk_words: 220
  chunk_overlap_words: 50
  split_seed: 20261013

encoder:
  # The fine-tuned encoder is evaluated where it exists (the harness reports a
  # row as skipped, with the reason, when the artefact has not been trained).
  kind: projection
  dim: 128
  artifact_dir: data/retrieval_artifacts/retrieval_finetune

training:
  loss: multiple_negatives_ranking
  select_on: dev_mrr
  phase: train

hybrid:
  bm25_k1: 1.2
  bm25_b: 0.75
  title_boost: 2.0
  fusion_k: 60
  dense_weight_grid: [0.0, 0.5, 1.0]
  rerank_candidates: 20
  top_k: 5
  language_filter: false

reranker:
  kind: lexical
  candidates: 20
  artifact_dir: data/retrieval_artifacts/reranker_v1

calibration:
  # `answer_precision` takes the lowest threshold that keeps the cards it shows
  # relevant at or above the floor, so the floor is a product decision, not a
  # statistic. It started at 0.9 and the *calibration* split rejected it: at 0.9
  # the fitted floor answered 2 of 13 answerable calibration queries (hybrid) and
  # 5 of 13 (hybrid_rerank) — a retriever that is right almost every time it
  # speaks and silent almost always is not a feature anybody experiences as help.
  # 0.7 is what the same split supports: on calibration it answers ~77-85% of
  # answerable queries with ~0.64-0.70 measured precision, and the measured
  # precision is a *lower* bound because the eval set's labels are incomplete
  # (data/retrieval/DATASET_CARD.md §8 records the known gaps). Both other
  # objectives are fitted too and printed beside the shipped one, so the
  # trade-off is visible rather than buried in a config value.
  objective: answer_precision
  min_answer_precision: 0.7
  top_k_for_answer: 3
  fit_split: calibration

evaluation:
  ks: [1, 3, 5]
  bootstrap: 2000
  latency_repeats: 3
  failure_cases: 10
  split: test

tracking:
  experiment: manovia-ml
  run_name: null
  tags:
    day: "35"
    stage: "retrieval-eval"

threads: 1
