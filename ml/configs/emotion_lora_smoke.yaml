# The CI path for Day 32: the whole LoRA pipeline on a randomly-initialised tiny
# XLM-R, in seconds, on one CPU, with no network.
#
# What this config is FOR: thresholds, artefacts, MLflow records, the evaluation
# report, the fallback path in the backend — every piece of plumbing between a
# config and a usable model. What it is NOT: a quality claim. `base_model:
# tiny://xlm-roberta` builds a 2-layer, 32-hidden stand-in (see
# src/manovia_ml/training/emotion/tiny.py) whose weights are random, so its
# macro-F1 is noise by construction. Every report it produces says so.
#
# The real runs are configs/emotion_lora_xlmr.yaml and configs/emotion_lora_muril.yaml
# on a GPU (ml/notebooks/colab_emotion_lora.ipynb). This file exists so a broken
# training loop cannot hide behind "it needs a GPU".
name: emotion_lora_smoke

seed: 20261013

notes: >
  Tiny random-init XLM-R, 12 optimiser steps, 2 epochs, 60 toy training rows,
  24 toy validation rows for threshold tuning, and the 174-row hand-written
  multilingual set as the held-out split. Plumbing only — the numbers measure
  the pipeline, not emotion recognition.

data:
  train:
    path: data/processed/toy_train.jsonl
    sha256: "06953a704a7a92b979d5f8203096abb88939788a10be9937cef766dd74e694f9"
    rows: 60
  # Early stopping / model selection.
  eval:
    path: data/processed/toy_eval.jsonl
    sha256: "0d3af2f0dbbc9b66d89bae86ebfe4fca0604332a392981a55099ca5da82919f1"
    rows: 24
  # Threshold tuning. Never the test split.
  validation:
    path: data/processed/toy_eval.jsonl
    sha256: "0d3af2f0dbbc9b66d89bae86ebfe4fca0604332a392981a55099ca5da82919f1"
    rows: 24
  # Held out from training and from tuning. Loaded from the same file as the
  # real runs so the schema, the languages and the label set are exercised.
  test:
    path: data/validation/emotion_validation.jsonl
    sha256: "fb116c7cf6c7f43f0571451b18a6a1e4d898ba5ce4e5f93663d4bb7aae41b08c"
    rows: 174
  text_field: text
  label_field: labels
  lang_field: lang
  labels: [joy, sadness, anger, fear, anxiety, shame, loneliness, calm, neutral]

model:
  kind: emotion_lora
  base_model: tiny://xlm-roberta
  tokenizer_max_length: 32
  lora:
    rank: 4
    alpha: 8
    dropout: 0.05
    target_modules: [query, value]
    bias: none
    freeze_base: false
  training:
    epochs: 2
    batch_size: 8
    eval_batch_size: 16
    learning_rate: 3.0e-3
    weight_decay: 0.0
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    label_smoothing: 0.02
    class_weighting: balanced
    scheduler: cosine
    # "auto" resolves to fp32 on this CPU-only box; the run logs which one it got.
    mixed_precision: auto
    # No trend exists over 12 steps, so early stopping would only add noise.
    early_stopping_patience: 0
    max_steps: 12
    log_every_steps: 4

evaluation:
  # The baseline check's tolerance, and why it is not 1e-6 like the linear-kind
  # configs: on CPU the *continuous* metrics of a torch run are not bit-exact
  # (blocked reductions in ATen/MKL reorder their sums). Measured here on
  # 2026-10-13 over two runs of this exact config: every thresholded metric
  # (macro/micro-F1, subset accuracy) identical to the last digit, ECE moving by
  # up to ~1e-2, train loss by ~1e-5 from step 2. A tighter tolerance would turn
  # float noise into a red CI; a looser one would stop noticing real drift.
  # `ml/tests/test_emotion_train.py::test_two_identical_runs_...` pins both halves.
  tolerance: 5.0e-2
  metrics: [accuracy, macro_f1, weighted_f1]
  confusion_matrix: true

emotion:
  thresholds:
    enabled: true
    search_min: 0.05
    search_max: 0.95
    search_steps: 19
    metric: f1
    # The toy validation split is 24 rows: 2 positives is the most a rare label
    # can have, so the floor is lowered here *explicitly* rather than in code.
    min_support: 2
    default: 0.5
  optuna:
    enabled: false
    n_trials: 4
    rank_choices: [4, 8]
    learning_rate_low: 1.0e-3
    learning_rate_high: 1.0e-2
  report:
    bootstrap_resamples: 500
    confidence_level: 0.95
    calibration_bins: 6
    error_cases: 20
    baselines: [keyword]
  artifact_dir: artifacts/emotion
  artifact_name: manovia-emotion-smoke

tracking:
  experiment: manovia-ml-emotion
  tracking_uri: null
  log_environment: true
  run_name: null
  tags:
    purpose: smoke
    model: tiny-random-xlm-roberta
    data: toy_emotion + handwritten_val_v1

threads: 1
