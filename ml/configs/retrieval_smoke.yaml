# Day 35 smoke: the whole retrieval pipeline, end to end, in seconds, offline.
#
# What this proves: the pairs build, the contrastive step, epoch selection on
# dev, the artefact round-trip, the BM25/fusion/rerank path through the
# *backend's* serving classes, the calibration fit and the report writer. What
# it does NOT prove: quality. Two epochs on 97 rows with a hashed feature space
# is plumbing, and `training.phase: smoke` travels into the MLflow tags and the
# report title so no number from this file can be quoted as a result.
#
# Run: make ml-retrieval-smoke   (needs the backend importable for the harness
# rows; the encoder rows run without it and say so).
name: retrieval_smoke

seed: 20261014

notes: >-
  Smoke only: two contrastive epochs, a three-point fusion grid, thresholds on
  the calibration split. Measures the pipeline, not retrieval quality.

data:
  eval_set: data/retrieval/expanded.jsonl
  splits_dir: data/retrieval_splits
  chunk_words: 220
  chunk_overlap_words: 50
  split_seed: 20261013

encoder:
  kind: projection
  dim: 32
  artifact_dir: data/retrieval_artifacts/retrieval_smoke
  features:
    word_ngram_range: [1, 1]
    char_ngram_range: [3, 4]
    word_max_features: 2000
    char_max_features: 2000

training:
  loss: multiple_negatives_ranking
  scale: 20.0
  epochs: 2
  batch_size: 8
  lr: 0.05
  hard_negatives: 2
  mine_candidates: 10
  max_positives_per_query: 1
  select_on: dev_mrr
  phase: smoke

hybrid:
  bm25_k1: 1.2
  bm25_b: 0.75
  title_boost: 2.0
  fusion_k: 60
  dense_weight_grid: [0.0, 0.5, 1.0]
  rerank_candidates: 10
  top_k: 5
  language_filter: false

reranker:
  kind: lexical
  candidates: 10
  c: 1.0
  train_split: train
  artifact_dir: data/retrieval_artifacts/reranker_smoke

calibration:
  objective: answer_precision
  min_answer_precision: 0.9
  top_k_for_answer: 3
  fit_split: calibration

evaluation:
  ks: [1, 3, 5]
  bootstrap: 0
  latency_repeats: 1
  failure_cases: 3
  split: dev

tracking:
  experiment: manovia-ml
  run_name: null
  tags:
    day: "35"
    stage: "retrieval-smoke"

threads: 1
