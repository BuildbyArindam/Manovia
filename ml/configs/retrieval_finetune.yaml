# Day 35: contrastive fine-tuning of the retrieval embedding.
#
# Two paths read this one file, and the difference is exactly one key:
#
#   encoder.kind: projection          offline, runs in this sandbox. Lexical
#                                     features (word 1-2 grams + char_wb 3-5
#                                     grams, TF-IDF, the same space the
#                                     backend's offline embedder uses) projected
#                                     into `dim` dimensions by a matrix trained
#                                     with MultipleNegativesRankingLoss. No
#                                     torch, no download, ~10 s on one CPU.
#   encoder.kind: sentence_transformers
#                                     the real thing: a multilingual checkpoint
#                                     fine-tuned with the same loss and the same
#                                     pairs, on Colab/Kaggle, via
#                                     ml/notebooks/colab_retrieval_finetune.ipynb.
#                                     Needs `encoder.model_id` and a GPU or a lot
#                                     of patience; NOT run in this sandbox.
#
# Either way the *data* is identical (train split only), the selection metric is
# identical (dev MRR), and the test split is never read here — see
# data/retrieval/DATASET_CARD.md and docs/adr/0035-*.
name: retrieval_finetune

seed: 20261014

notes: >-
  Contrastive fine-tuning of the retrieval encoder on the Day-35 train split
  (97 queries, 42 hand-written + 55 template paraphrases), hard negatives mined
  from near-miss passages, epoch chosen on dev MRR. The offline `projection`
  encoder is what this sandbox can run; the Colab notebook runs the same loss on
  a real multilingual checkpoint.

data:
  eval_set: data/retrieval/expanded.jsonl
  splits_dir: data/retrieval_splits
  chunk_words: 220
  chunk_overlap_words: 50
  split_seed: 20261013

encoder:
  kind: projection
  dim: 128
  # Empty = train one and write it to data/retrieval_artifacts/<name>/, which
  # ml/.gitignore keeps out of Git (a projection matrix is a weight).
  artifact_dir: ""
  features:
    word_ngram_range: [1, 2]
    char_ngram_range: [3, 5]
    word_max_features: 8000
    char_max_features: 8000
    min_df: 1
    sublinear_tf: true

training:
  loss: multiple_negatives_ranking
  scale: 20.0
  epochs: 12
  batch_size: 16
  lr: 0.05
  hard_negatives: 4
  mine_candidates: 20
  max_positives_per_query: 2
  select_on: dev_mrr
  phase: train

hybrid:
  # Not used by this stage; kept at the values the harness and the backend
  # agree on so one file describes the whole retrieval system.
  bm25_k1: 1.2
  bm25_b: 0.75
  title_boost: 2.0
  fusion_k: 60
  rerank_candidates: 20
  top_k: 5
  language_filter: false

reranker:
  kind: none

calibration:
  objective: answer_precision
  min_answer_precision: 0.9
  top_k_for_answer: 3
  fit_split: calibration

evaluation:
  ks: [1, 3, 5]
  bootstrap: 2000
  latency_repeats: 3
  failure_cases: 10
  split: dev

tracking:
  experiment: manovia-ml
  run_name: null
  tags:
    day: "35"
    stage: "retrieval-encoder"

threads: 1
