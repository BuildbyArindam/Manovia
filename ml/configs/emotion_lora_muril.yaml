# The Indic-comparison run: MuRIL instead of XLM-R, same data, same code path.
#
# Why this config exists: xlm-roberta-base and MuRIL are the two candidates the
# Day-32 brief names, and the decision between them should be evidence, not
# taste. The measurement only happens on a GPU machine (see
# ml/notebooks/colab_emotion_lora.ipynb); this file makes the comparison one
# command rather than a rewrite.
#
# Verified on the Hub (2026-10-13, via the API):
#   id          google/muril-base-cased
#   licence     Apache-2.0
#   architecture BERT-base: 12 layers, hidden 768, 12 heads, vocab 197,285
#   languages   17 Indian languages *plus* their transliterated (romanised)
#               counterparts, trained with translation and transliteration
#               segment pairs - which is why it is the interesting candidate for
#               Hinglish and Banglish, the registers Manovia's users actually type
#   sha         afd9f36c7923d54e97903922ff1b260d091d202f
#   caveats     the card says it is "not expected to perform well on languages
#               other than the ones used in pretraining"; its English is weaker
#               than XLM-R's, and the released weights are PyTorch-only
#               (no safetensors file), so the loader has to accept .bin.

name: emotion_lora_muril

seed: 20261013

notes: >
  MuRIL (Apache-2.0) with LoRA rank 16, same data, thresholds and evaluation as
  the XLM-R config, so the two runs differ in exactly one variable. Expect a
  trade: better Hindi/Bengali transfer, weaker English than XLM-R.

data:
  train:
    path: data/raw/goemotions_multi/train.jsonl
    sha256: null
    rows: null
  eval:
    path: data/raw/goemotions_multi/validation.jsonl
    sha256: null
    rows: null
  validation:
    path: data/raw/goemotions_multi/validation.jsonl
    sha256: null
    rows: null
  test:
    path: data/validation/emotion_validation.jsonl
    sha256: "fb116c7cf6c7f43f0571451b18a6a1e4d898ba5ce4e5f93663d4bb7aae41b08c"
    rows: 174
  text_field: text
  label_field: labels
  lang_field: lang
  labels: [joy, sadness, anger, fear, anxiety, shame, loneliness, calm, neutral]

model:
  kind: emotion_lora
  base_model: google/muril-base-cased
  tokenizer_max_length: 128
  lora:
    rank: 16
    alpha: 32
    dropout: 0.1
    target_modules: [query, value]
    bias: none
    freeze_base: false
  training:
    epochs: 3
    batch_size: 32
    eval_batch_size: 64
    learning_rate: 3.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.06
    max_grad_norm: 1.0
    label_smoothing: 0.02
    class_weighting: balanced
    scheduler: cosine
    # fp16 on a T4/V100; "auto" resolves to fp32 if the machine has no GPU.
    mixed_precision: auto
    gradient_accumulation_steps: 1
    early_stopping_patience: 2
    early_stopping_min_delta: 0.001
    max_steps: null
    log_every_steps: 50

evaluation:
  tolerance: 2.0e-2
  metrics: [macro_f1, weighted_f1]
  confusion_matrix: true

emotion:
  thresholds:
    enabled: true
    search_min: 0.05
    search_max: 0.95
    search_steps: 19
    metric: f1
    # A label with fewer than five positives on the GoEmotions validation split
    # keeps the default rather than fitting a threshold to three rows.
    min_support: 5
    default: 0.5
  optuna:
    enabled: false          # turn on deliberately; `ml-emotion-tune` runs it
    n_trials: 12            # the brief's cap
    rank_choices: [4, 8, 16, 32]
    learning_rate_low: 1.0e-4
    learning_rate_high: 3.0e-3
    metric: macro_f1
    seed: null
  report:
    bootstrap_resamples: 2000
    confidence_level: 0.95
    calibration_bins: 10
    error_cases: 20
    baselines: [keyword, baseline]
  artifact_dir: artifacts/emotion
  artifact_name: manovia-emotion-muril-v1

tracking:
  experiment: manovia-ml-emotion
  tracking_uri: null
  log_environment: true
  run_name: null
  tags:
    purpose: research
    model: muril-base-cased
    data: goemotions_multi + handwritten_val_v1
    gpu: required

threads: null
