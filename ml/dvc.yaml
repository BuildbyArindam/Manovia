# DVC pipeline for the ML platform (Day 31).
#
# Stages here produce *derived* files from committed inputs. The heavy corpora
# (GoEmotions, a future hi/bn set) are not downloaded by any stage: they are
# fetched by the documented steps in data/CATALOGUE.md and then versioned with
# `dvc add`, because a network download inside a stage makes `dvc repro`
# non-hermetic and `dvc status` meaningless offline (AGENTS.md, ML ground rule 10).
#
# Run from this directory (`make ml-data` does it with the right interpreter):
#   python -m dvc repro     regenerate the splits, compare hashes to dvc.lock
#   python -m dvc status    "Data and pipelines are up to date." or what changed
#
# The splits are a pure function of (fixture bytes, code, seed, train_fraction),
# so `dvc repro` on a fresh clone either reproduces the md5 recorded in
# dvc.lock or fails — which is the CI-level reproducibility check, independent of
# the MLflow one in ml/tests/test_reproducibility.py.
stages:
  toy_split:
    desc: >
      Six-class splits from the hand-written fixture: the shape and
      multilingual check (en, hi, hi-Latn, bn × six emotions).
    cmd: >-
      python -m manovia_ml.data.toy
      --out-dir data/processed --seed 20261013 --train-fraction 0.7 --prefix toy
    deps:
      - data/toy/toy_emotion.jsonl
      - src/manovia_ml/data/toy.py
      - src/manovia_ml/seeds.py
      - src/manovia_ml/hashing.py
      - src/manovia_ml/paths.py
    outs:
      - data/processed/toy_train.jsonl
      - data/processed/toy_eval.jsonl
      - data/processed/toy.manifest.json

  toy_smoke_split:
    desc: >
      Two-class (joy/anger) slice used by configs/toy_emotion_sgd.yaml — the
      config CI and `make ml-smoke` run. A binary problem at 20 rows has a
      signal a bag-of-n-grams model can actually find, which keeps the smoke
      metrics readable as a canary.
    cmd: >-
      python -m manovia_ml.data.toy
      --out-dir data/processed --seed 20261013 --train-fraction 0.7
      --labels joy,anger --prefix toy_smoke
    deps:
      - data/toy/toy_emotion.jsonl
      - src/manovia_ml/data/toy.py
      - src/manovia_ml/seeds.py
      - src/manovia_ml/hashing.py
      - src/manovia_ml/paths.py
    outs:
      - data/processed/toy_smoke_train.jsonl
      - data/processed/toy_smoke_eval.jsonl
      - data/processed/toy_smoke.manifest.json

  # Day 33: the hand-written safety fixture's four-way split. This is the only
  # place a fourth slice is cut, because it is the only place there is no frozen
  # held-out file to protect; the real corpus's held-out split is the Day-9 file
  # and it is read by the evaluator alone.
  safety_toy_split:
    desc: >-
      Train/dev/calibration/test slices of the hand-written safety fixture
      (80 rows, 5 risk levels x en/hi/hi-Latn/bn). Feeds
      configs/safety_lora_smoke.yaml.
    cmd: >-
      python -m manovia_ml.training.safety.build_data --toy
      --out-dir data/safety_toy --seed 20261013
    deps:
      - data/toy/safety_toy.jsonl
      - src/manovia_ml/training/safety/build_data.py
      - src/manovia_ml/training/safety/data.py
      - src/manovia_ml/hashing.py
      - src/manovia_ml/paths.py
      - src/manovia_ml/seeds.py
    outs:
      - data/safety_toy/train.jsonl
      - data/safety_toy/dev.jsonl
      - data/safety_toy/calibration.jsonl
      - data/safety_toy/test.jsonl
      - data/safety_toy/manifest.json

  # Day 33: the expanded synthetic safety corpus. Deterministic given the seeds,
  # the code and the seed value: the paraphraser is the offline Fake by default,
  # so `dvc repro` needs no network and no vendor (AGENTS.md, ML ground rule 10).
  # The frozen test split is deliberately NOT a dependency: it is an input to the
  # evaluator and to nothing else, and there is no code path here that opens it.
  safety_expand:
    desc: >-
      Expand the hand-written Day-9 train + dev seeds into the synthetic safety
      corpus (template paraphrase + adversarial augmentation, rules-engine label
      filtering, method-word and duplicate screens), then split it into
      train/dev/calibration.
    cmd: >-
      python -m manovia_ml.training.safety.build_data
      --seeds ../evals/datasets/crisis_cases_train.jsonl
      --seeds ../evals/datasets/crisis_cases_dev.jsonl
      --out-dir data/safety --seed 20261013 --paraphrases 4 --adversarial 1
    deps:
      - ../evals/datasets/crisis_cases_train.jsonl
      - ../evals/datasets/crisis_cases_dev.jsonl
      - src/manovia_ml/training/safety/build_data.py
      - src/manovia_ml/training/safety/data.py
      - src/manovia_ml/training/safety/augment.py
      - src/manovia_ml/training/safety/providers.py
      - src/manovia_ml/hashing.py
      - src/manovia_ml/paths.py
      - src/manovia_ml/seeds.py
    outs:
      - data/safety/train.jsonl
      - data/safety/dev.jsonl
      - data/safety/calibration.jsonl
      - data/safety/dropped.jsonl
      - data/safety/manifest.json
