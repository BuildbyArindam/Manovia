# Manovia CI.
#
# Jobs mirror the local `make lint` / `make test` targets, so a green local run
# means a green CI run. Every job here can fail the pipeline: the secrets scan
# (Day 7) and the dependency audit (Day 22) both block. The audit was
# report-only until 2026-10-12; it is now the gate the brief asked for — see the
# `dependency-audit` job for exactly what fails and what does not.
#
# Third-party actions are pinned to commit SHAs, not to floating major tags
# (`@v5`), because a tag is mutable and a workflow that runs on every push is
# the highest-value place to plant a compromised dependency. The `# vX.Y.Z`
# comment keeps the pin readable. Day 22 fetched these:
#   actions/checkout         v5 → fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   actions/setup-python     v6 → ece7cb06caefa5fff74198d8649806c4678c61a1
#   actions/setup-node       v6 → 249970729cb0ef3589644e2896645e5dc5ba9c38
#   gitleaks/gitleaks-action v2 → ff98106e4c7b2bc287b24eaf42907196329070c7
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time; a new push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the checkout.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff, mypy, pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy (strict)
        # Annotations mirror the ML job's pytest pattern: the raw step log
        # is not always readable from a restricted network, while
        # ::error annotations are available through the checks API. The
        # step still exits with mypy's own status.
        run: |
          set +e
          mypy app tests > /tmp/mypy.log 2>&1
          status=$?
          cat /tmp/mypy.log
          if [ "$status" -ne 0 ]; then
            grep -E "error:" /tmp/mypy.log | head -30 | while read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: pytest with coverage (fail under 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend — lint, typecheck, vitest, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test:run

      - name: Production build
        run: npm run build

  secrets-scan:
    name: Secrets scan — gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Blocking. gitleaks is the authority for secret detection; the offline
      # stand-in for machines that cannot run the binary is
      # `python scripts/scan_secrets.py` (same rule set, weaker engine — read
      # its docstring before trusting it).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit — fail on high
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Blocking, and deliberately stricter than "high": pip-audit has no
      # severity filter, so any known advisory fails the job. It was clean when
      # this gate was switched on (2026-10-12, verified locally), which is what
      # makes the strictness free. If an advisory ever appears with no fixed
      # version, add `--ignore-vuln <ID>` with a dated comment saying why and
      # when it can be revisited — never delete the step.
      #
      # `manovia-backend` itself shows up as an unaudited "dependency not found
      # on PyPI" skip: that is this project, installed editable. `--strict`
      # would turn that self-skip into a failure, which is why it is not used.
      - name: pip-audit (backend, blocking)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
          pip-audit --progress-spinner off --desc on

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Blocking on high/critical. `--audit-level=high` still *prints* lower
      # severities, so they land in the log and the summary below while not
      # failing the job: as of 2026-10-12 npm reports two moderate advisories in
      # `react-router` (via `react-router-dom`), whose only published fix is a
      # major upgrade — tracked in PROGRESS.md "Known issues", not hidden.
      - name: npm audit (frontend production deps, fail on high)
        working-directory: frontend
        run: |
          npm ci --omit=dev --ignore-scripts
          set +e
          report=$(npm audit --omit=dev --audit-level=high 2>&1)
          status=$?
          set -e
          printf '%s\n' "$report"
          {
            echo '## npm audit --omit=dev (frontend)'
            echo
            echo 'Gate: **high and critical fail the job**; moderate and below are reported here only.'
            echo
            if [ "$status" -eq 0 ]; then
              echo '✅ No high or critical advisories.'
            else
              echo '❌ At least one high/critical advisory — this job fails.'
            fi
            echo '```'
            printf '%s\n' "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Summarise (always)
        if: always()
        run: |
          {
            echo
            echo '### Backend audit'
            echo 'pip-audit blocks on **any** known advisory (no severity filter upstream).'
          } >> "$GITHUB_STEP_SUMMARY"

  # Day 31 ML platform. Mirrors `make ml-smoke` plus the ML suite, so a broken
  # data pipeline, a drifted baseline, a stale catalogue table or a dataset that
  # slipped into Git all fail a pull request. CPU-only, offline, ~2 minutes.
  #
  # Why every step here is a gate rather than a report:
  #   * `dvc repro && dvc status` — the regenerated splits must hash to what
  #     dvc.lock recorded; a non-deterministic split is a reproducibility bug.
  #   * `make smoke` — trains the toy model and compares the metrics against the
  #     committed baseline in ml/configs/expected/.
  #   * `manovia_ml.data.catalogue --check` — licences, verdicts and the
  #     generated table.
  #   * the tracked-file check — no dataset or model weights in Git, ever
  #     (AGENTS.md ML ground rule 3).
  ml-smoke:
    name: ML — smoke, reproducibility, catalogue
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        # Day 32: the CPU-only torch wheel first (the default PyPI wheel drags in
        # ~2 GB of CUDA kernels nobody here can use), then the project with the
        # `training` extra so the LoRA tests *run* instead of skipping.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,dev,training,serving]"

      - name: DVC lock matches the code (before repro rewrites it)
        # `dvc repro` regenerates dvc.lock, so a *committed* lock that names a
        # different version of the code than the commit contains is invisible
        # afterwards — which is precisely how a stale lock survived on Day 31
        # until a fresh clone was checked by hand. This runs first, and fails on
        # "changed deps" only (missing outputs are the normal state of a clone).
        run: python -m manovia_ml.data.dvc_lock

      - name: Data pipeline (dvc)
        run: |
          python -m dvc repro
          python -m dvc status

      - name: Catalogue (licences, verdicts, generated table)
        run: python -m manovia_ml.data.catalogue --check

      - name: Smoke run (toy train, baseline check, report)
        run: make smoke PYTHON=python
        env:
          # The file store is this project's default (ml/README.md § Tracking).
          MLFLOW_ALLOW_FILE_STORE: "true"

      - name: Emotion smoke run (Day 32, tiny random-init XLM-R)
        # The same code path as a real run — trainer, thresholds, artefact,
        # fresh-process evaluation, report — on a 2-layer stand-in, in seconds.
        # It is a *plumbing* gate; every metric it produces is noise, and the
        # report says so.
        run: make emotion-smoke PYTHON=python
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"

      - name: Tests (offline)
        # The JITAI simulation tests import the backend policy seam. Keep this
        # aligned with ml/Makefile, because this job installs the ML project but
        # not the backend as an editable package.
        env:
          PYTHONPATH: src:../backend
        # The log of a failed step is not always readable from a sandboxed
        # environment (the signed log URLs live on a host that may be blocked);
        # annotations are readable through the API. So when pytest fails, its
        # failing test ids are *also* emitted as error annotations, which is what
        # makes a red CI here diagnosable without the raw log.
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.log 2>&1
          status=$?
          tail -n 40 /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -30 | while read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Lint and types
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src tests

      - name: The ml/ tree is complete in Git
        # A file that exists on the author's disk and in no clone is the failure
        # this job was written to catch: ml/src/manovia_ml/data/ was silently
        # ignored by the repository's bare `data/` rule, so `git add` skipped it
        # and CI died at `dvc repro` looking for a module that only existed
        # locally. This step makes that class of mistake loud and immediate.
        run: |
          set -euo pipefail
          missing=$(comm -23 \
            <(find . -type f -name '*.py' -not -path './.venv/*' -not -path './mlruns/*' \
              | sed 's|^\./||' | sort) \
            <(git ls-files --full-name '*.py' | sed 's|^ml/||' | sort))
          if [ -n "$missing" ]; then
            echo "::error::Python files exist on disk but are not tracked by Git:"
            printf '%s\n' "$missing"
            echo "::error::Is a .gitignore rule swallowing them? (see the root .gitignore)"
            exit 1
          fi
          echo "all $(find . -type f -name '*.py' | wc -l) Python files under ml/ are tracked"

      - name: No datasets or model weights tracked in Git
        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -E '\.(bin|pt|pth|safetensors|csv|parquet|joblib|pkl|h5|onnx|ckpt)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::dataset or model artefacts are tracked in git:"
            printf '%s\n' "$offenders"
            exit 1
          fi
          echo "no dataset/weight files tracked ($(git ls-files | wc -l) files checked)"

      - name: Summarise (always)
        if: always()
        run: |
          {
            echo
            echo '### ML smoke (Day 31)'
            echo
            echo 'Path: `dvc repro` → catalogue check → toy train → baseline check → report.'
            echo 'Reports written by this job are in `ml/reports/smoke/` (untracked in CI).'
            for report in reports/smoke/*.md; do
              [ -f "$report" ] || continue
              echo
              echo "#### $(basename "$report")"
              echo '```markdown'
              cat "$report"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
