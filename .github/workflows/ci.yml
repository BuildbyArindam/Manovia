# Manovia CI — Day 7.
#
# Jobs mirror the local `make lint` / `make test` targets exactly, so a green
# local run means a green CI run. The secrets scan blocks; the dependency audit
# is report-only (continue-on-error) until the advisory backlog from Days 5-6
# is worked down — see PROGRESS.md "Known issues".
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time; a new push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the checkout.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff, mypy, pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy app tests

      - name: pytest with coverage (fail under 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend — lint, typecheck, vitest, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test:run

      - name: Production build
        run: npm run build

  secrets-scan:
    name: Secrets scan — gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit — report only
    runs-on: ubuntu-24.04
    # Report-only until the backlog is worked down (PROGRESS.md "Known
    # issues"); a failure here must not block the pipeline yet.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
          pip-audit --progress-spinner off

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend, production deps only)
        working-directory: frontend
        run: |
          npm ci --omit=dev --ignore-scripts
          npm audit --omit=dev
