# Manovia — fully free deploy to GitHub Pages (no Docker, no credit card)
#
# Triggers: push to main + manual dispatch.
# Builds the frontend statically and publishes frontend/dist to GitHub Pages.
# Backend is NOT on Pages — the frontend talks to VITE_API_BASE_URL if you set
# it (e.g. a Render backend), otherwise it runs in offline/PWA demo mode
# (breathing exercises, helplines, PWA install still work).
#
# Setup (one time, 30 seconds):
#   1. GitHub → repo Settings → Pages → Source: "GitHub Actions"
#   2. Push to main (or Run workflow manually) → live at https://<user>.github.io/Manovia/
# Until step 1 is done the build still runs (so a broken build is caught), and
# the deploy job skips with a warning naming this setting — it cannot enable
# Pages itself, because that needs repository administration rights.
#
# Actions are pinned to commit SHAs (a tag is mutable; this workflow runs on
# every push to main). `actions/upload-pages-artifact` and `actions/deploy-pages`
# must be a matching pair — both are on v5 here. Publishing a Pages site also
# needs `pages: write` + `id-token: write` at the top of this file.
#
# Custom domain (optional, still free Pages):
#   Settings → Pages → Custom domain → manovia.example.com → set ALLOWED_ORIGINS on backend.
#   Then set VITE_BASE="/" in the workflow env below (or keep default).
#   The app reads its base path at build time (router basename, static manifest
#   URLs and service-worker scope), so "/" and "/Manovia/" both work.
#
# API wiring (optional):
#   Repo → Settings → Secrets and variables → Actions → Variables:
#     - VITE_API_BASE_URL = https://your-backend.onrender.com/api/v1  (or Fly URL)
#     Leave unset for pure frontend offline demo (calls to /api/v1 will 404 gracefully).
#
name: Deploy frontend — GitHub Pages (fully free)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Override VITE_API_BASE_URL (e.g. https://manovia-api.onrender.com/api/v1). Leave blank for offline demo."
        required: false
        default: ""

# Least privilege for Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build (Vite)
        working-directory: frontend
        env:
          # Project Pages live under /Manovia/ — set base so assets + router resolve.
          # For a user/org Pages site ( <user>.github.io ) or custom domain, set "/" instead.
          VITE_BASE: "/Manovia/"
          # API: dispatch input wins, else repo variable, else fallback (offline demo)
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL || '' }}
        run: |
          echo "VITE_BASE=$VITE_BASE"
          echo "VITE_API_BASE_URL=${VITE_API_BASE_URL:-<empty — offline demo>}"
          npm run build
          # SPA fallback on GitHub Pages: 404.html serves index.html via JS
          cp dist/index.html dist/404.html
          # Bypass Jekyll processing (ensures _next, dotfiles, etc. are served)
          touch dist/.nojekyll
          # Verify portfolio footer survived tree-shaking (required)
          if ! grep -q "Portfolio demo" dist/assets/*.js 2>/dev/null; then
            echo "::warning::Portfolio demo footer not found in bundle — check locales"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist
          # The build writes `dist/.nojekyll`. upload-pages-artifact v4+ drops
          # dotfiles from the tarball unless asked, which would silently undo
          # the step above.
          include-hidden-files: true

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A Pages deploy needs the repository setting "Source: GitHub Actions".
      # Without it `deploy-pages` fails with a message that does not say what to
      # change, so check first and skip with an actionable warning instead of a
      # red X nobody can act on. Reading the Pages site needs `pages: write`,
      # which this workflow already grants.
      - name: Check Pages settings
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" > "$RUNNER_TEMP/pages.json" 2>/dev/null; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=GitHub Pages is not enabled for this repository." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build_type=$(jq -r '.build_type // "legacy"' "$RUNNER_TEMP/pages.json")
          if [ "$build_type" != "workflow" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=GitHub Pages is published from a branch (build_type=$build_type), not from Actions." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Skip deploy — Pages is not configured for Actions
        if: steps.pages.outputs.enabled != 'true'
        run: |
          {
            echo "### Deploy skipped: GitHub Pages is not configured for Actions"
            echo ""
            echo "${{ steps.pages.outputs.reason }}"
            echo ""
            echo "Fix (repository admin, one click): **Settings → Pages → Build and deployment → Source: GitHub Actions**, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Pages deploy skipped::${{ steps.pages.outputs.reason }} Set Settings → Pages → Source: GitHub Actions, then re-run."

      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Optional: keep a11y check green — comment out if you don't want it on Pages
  # This reuses the same built artifact; skip if you want faster deploys.
