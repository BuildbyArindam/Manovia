# Manovia web container: serves the Vite build and proxies /api to the api
# service so the browser only ever talks to its own origin.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite — cache them hard. The security
    # headers are included again here because a `location` block that declares
    # any `add_header` of its own stops inheriting the server's.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Security headers, mirroring the API's SecurityHeadersMiddleware posture:
    # nosniff, no framing, no referrer, no capabilities, and a strict CSP whose
    # one relaxation (inline styles) is documented in the included file.
    include /etc/nginx/security-headers.conf;

    # API: same-origin reverse proxy. No URI part on proxy_pass, so the path
    # (/api/v1/...) is forwarded unchanged. The client IP is appended to
    # X-Forwarded-For; the API deliberately does not trust that header yet
    # (see PROGRESS.md "Known issues"), so rate limiting keys on the proxy —
    # acceptable for this dev topology, wrong for a shared deployment.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: every unknown non-file route loads the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
