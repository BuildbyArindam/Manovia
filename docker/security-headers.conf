# Security headers for the web container, in one place because nginx drops
# every inherited `add_header` in a `location` block that declares one of its
# own. Both `location /assets/` (Cache-Control) and the server block include
# this file, so a static asset is never served with a weaker posture than the
# document that loads it.
#
# The CSP is strict on purpose and is the reason `index.html` carries no inline
# script: `script-src 'self'` means the only JavaScript that runs is code
# shipped in the build. `style-src` needs `'unsafe-inline'` because the app sets
# a few element styles through React; it is the one relaxation here and it is
# listed as such.
#
# Day 23 (multilingual): the two Google Fonts origins are the one deliberate
# third-party allowance, so Hindi and Bengali render with Noto Sans
# Devanagari / Bengali (index.html links the stylesheet). fonts.googleapis.com
# serves only the CSS; fonts.gstatic.com serves only the font files.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Permitted-Cross-Domain-Policies none always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
